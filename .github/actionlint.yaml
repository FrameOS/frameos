# The self-hosted runner pool (tools/gha-runners/README.md): ephemeral Incus
# VMs on the monster host, one label per slot size. actionlint only knows
# GitHub's own labels, so ours have to be declared here or every
# `runs-on: epyc-*` is reported as an unknown label. Keep this list in step
# with the LABELS= line of tools/gha-runners/slots/*.env — the "Lint workflows" job
# in pull-request-tests.yml is what reads it.
self-hosted-runner:
  labels:
    - epyc-32
    - epyc-8
    - epyc-4
