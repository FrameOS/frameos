name: Cloud CI

# The cloud app consumes frameos-wasm, frameos-editor and cloud-frontend as
# workspace packages, so its build pulls in the frontend build. The wasm
# runtime itself is NOT built here: auth-web's prebuild installs the signed
# frameos-<version>-wasm.tar.gz from the release pinned in versions.json
# (scripts/lib/wasm-runtime.mjs), so the preview renders with the interpreter
# frames run — a runtime built from main showed features the last firmware
# did not have. Turbo caches every step: warm runs skip whatever didn't
# change.
#
# These paths are the inputs of everything `turbo run build
# --filter=@frameos-cloud/auth-web` builds (see turbo.json). A missing one is
# not a saved CI run — since this workflow deploys, it means the change is
# merged and silently never reaches production. Check the task graph with
# `pnpm exec turbo run build --filter=@frameos-cloud/auth-web --dry=json`
# before trimming anything here.
on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "frontend/**"
      # The frames SPA served at /frames, built into auth-web's public/.
      - "cloud-frontend/**"
      # Declared input of both the frontend and cloud-frontend builds.
      - "repo/**"
      - "frameos/wasm/**"
      - "frameos/editor/**"
      # The Nim runtime sources are deliberately NOT here: the wasm bundle
      # comes from the release pinned in versions.json, and a release
      # reaches production through the workflow_run trigger below.
      - "versions.json"
      - "release-assets/firmware-signing.pub"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloud-ci.yml"
  # A release does not reach production through the `push` trigger above, and
  # cannot be made to. "Release FrameOS" pushes `chore: version X` — which
  # touches frameos/editor/package.json and frameos/wasm/package.json, both
  # matched above — using the default GITHUB_TOKEN, and GitHub deliberately
  # fires no `push` workflows for commits pushed with that token. 2026.8.23
  # shipped with the cloud still serving 2026.8.22 for exactly this reason.
  # (A `release: published` trigger would be just as dead: that release is
  # created with `github.token` too.) `workflow_run` is the one event the
  # recursion guard does not suppress, and it also lands where we want it —
  # after the artefacts and images are published, not at the version bump
  # near the start of the run.
  workflow_run:
    workflows: ["Release FrameOS"]
    types: [completed]
  pull_request:
    paths:
      - "cloud/**"
      - "frontend/**"
      - "cloud-frontend/**"
      - "repo/**"
      - "frameos/wasm/**"
      - "frameos/editor/**"
      - "versions.json"
      - "release-assets/firmware-signing.pub"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cloud-ci.yml"

# Superseded runs on the same PR are cancelled; pushes to main always run to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token GitHub hands the jobs is read-only. Neither job comments on PRs,
# writes checks or statuses, or uses OIDC: verify only checks out and builds,
# and deploy reaches production over an SSH key held in the `production`
# environment, not through the GitHub API. The wasm runtime download is a
# plain unauthenticated GET of a public release asset.
permissions:
  contents: read

# NEXT_PUBLIC_* values are inlined into the browser bundle when `next build`
# runs — which is here, on the runner, not on the server. The key in
# /etc/frameos-cloud/auth-web.env only reaches the server-side uses
# (error-tracking.ts, posthog-capture.ts); without this, the deployed
# bundle calls posthog.init("") and analytics is silently off. A repository
# variable, not a secret: the token is public by design (it ships in the
# served JS). Workflow-level so verify builds with the same value and the
# deploy job's turbo cache replay stays warm — turbo.json declares the
# variable as an env input of @frameos-cloud/auth-web#build, so a keyed
# build can never replay a keyless cache. NEXT_PUBLIC_POSTHOG_HOST is not
# set here: the code defaults to https://eu.i.posthog.com; add it the same
# way if that ever changes.
env:
  NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}

jobs:
  verify:
    # A failed release publishes nothing to deploy, so do not spend a full
    # verify on it. deploy needs verify and integration, so skipping both
    # stops it.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # A 16-core slot of the self-hosted pool (tools/gha-runners/README.md):
    # turbo's lint/typecheck/test/build is CPU, and auth-web's 336 test files
    # alone took two minutes on a 4-core GitHub runner. Pull requests from
    # forks stay on GitHub's. The turbo cache still comes from (and goes to)
    # GitHub's cache, which keeps a pull request's entries away from main's:
    # deploy below replays this job's build into production.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    permissions:
      contents: read

    # A release run finishes minutes after it pushed the version bump, so a
    # workflow_run event's own `github.sha` is not necessarily the main this
    # deploy is about to ship. Verify the tip, so that what passed here is
    # what goes out.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || '' }}

      # Reads the pnpm version from the packageManager field in package.json.
      # On the pool the pnpm store comes with the VM image.
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-cloud-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-cloud-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Lint, typecheck, test, and build the cloud workspace; turbo builds
      # the frontend, editor, and wasm packages it depends on. auth-web's
      # prebuild downloads and verifies the release's wasm runtime.
      # cloud-frontend (the frames SPA wrapper auth-web serves) is built by
      # esbuild, which checks no types, so its typecheck task rides along.
      # The integration suites are the `integration` job below.
      - run: pnpm exec turbo run lint typecheck test build --filter='@frameos-cloud/*' --filter=@frameos/cloud-frontend --summarize

      # Keep only what this run used. The cache is restored by prefix and saved
      # whole, so it carried every artifact of every earlier run: 1.2 GB by
      # 2026-11, most of a minute to move from the pool. What this run's tasks
      # hashed to is all that the next run (or deploy's replay of this build)
      # can hit anyway.
      - name: Prune the turbo cache to this run
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".turbo")
          runs = sorted((root / "runs").glob("*.json"), key=lambda p: p.stat().st_mtime)
          if not runs:
              raise SystemExit("no turbo run summary; leaving the cache as it is")
          keep = {task.get("hash") for task in json.loads(runs[-1].read_text()).get("tasks", [])}
          keep.discard(None)
          if not keep:
              raise SystemExit("the run summary names no task hashes; leaving the cache as it is")
          removed = kept = 0
          for entry in (root / "cache").iterdir():
              if entry.name.split(".")[0].split("-")[0] in keep:
                  kept += 1
              else:
                  entry.unlink()
                  removed += 1
          for summary in runs:
              summary.unlink()
          print(f"turbo cache: kept {kept} files of {len(keep)} tasks, removed {removed}")
          PY
          du -sh .turbo

  # The integration suites against a real Postgres, one service container per
  # leg: auth-web's (the slowest, 47 files that share one database and so run
  # one after another) in four shards, and the frame hub's with the ledger's
  # (each creates its own database). Never two copies of one suite against
  # one database: every leg has a Postgres of its own. Side by side with
  # verify, which it used to run after.
  integration:
    name: integration (${{ matrix.leg }})
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: [auth-web 1/4, auth-web 2/4, auth-web 3/4, auth-web 4/4, frame-hub + ledger]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: frameos_cloud
          POSTGRES_PASSWORD: frameos_cloud
          POSTGRES_DB: frameos_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || '' }}

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile

      # What the suites import that turbo built for them in verify: the
      # frameos-wasm package's dist (scene-render.ts imports it), and
      # auth-web's generated AI context (its pretest:integration hook, which
      # the shards below skip by calling vitest themselves for --shard).
      - name: Build what the suites import
        run: |
          pnpm exec turbo run build --filter=frameos-wasm
          pnpm --filter @frameos-cloud/auth-web exec node scripts/generate-ai-context.mjs

      # Backend-linking flow against the Postgres service container.
      - name: auth-web
        if: startsWith(matrix.leg, 'auth-web ')
        env:
          TEST_DATABASE_URL: postgres://frameos_cloud:frameos_cloud@127.0.0.1:5432/frameos_cloud_test
          SHARD: ${{ matrix.leg }}
        run: pnpm --filter @frameos-cloud/auth-web exec vitest run --config vitest.integration.config.ts --shard="${SHARD#auth-web }"

      # Frame hub: device/browser WebSocket protocol against real Postgres
      # (its global-setup creates its own database so the suites can share
      # the service container).
      - name: frame-hub
        if: matrix.leg == 'frame-hub + ledger'
        run: pnpm --filter @frameos-cloud/frame-hub test:integration
        env:
          TEST_DATABASE_URL: postgres://frameos_cloud:frameos_cloud@127.0.0.1:5432/frameos_cloud_frame_hub_test

      # Accounting: the posting kernel, the append-only triggers and the
      # ledger invariants, against real Postgres (same story, own database).
      - name: ledger
        if: matrix.leg == 'frame-hub + ledger'
        run: pnpm --filter @frameos-cloud/ledger test:integration
        env:
          TEST_DATABASE_URL: postgres://frameos_cloud:frameos_cloud@127.0.0.1:5432/frameos_cloud_ledger_test

  # Every merge to main that verify approves goes to production, unattended.
  # The pieces that make that safe are on the server, not here: migrations run
  # before anything is flipped, the new release has to answer /healthz on the
  # idle port before nginx is moved to it, and a release that never becomes
  # healthy is a failed deploy rather than an outage. See
  # cloud/docs/deployment.md, "Automatic deploys" — including how to pause
  # this (the FRAMEOS_CLOUD_AUTO_DEPLOY variable) and how to roll back.
  deploy:
    name: Deploy to production
    needs: [verify, integration]
    # Two ways in: a merge to main, and a finished release. A release that
    # failed is not a release — deploying the half of it that landed is worse
    # than deploying nothing.
    if: >-
      vars.FRAMEOS_CLOUD_AUTO_DEPLOY == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Deployment history, and the one place the deploy secrets live. Nothing
    # else in this repo can read them.
    environment:
      name: production
      url: https://cloud.frameos.net

    # Its own group, separate from the workflow-level one above: two merges in
    # quick succession must not deploy at the same time, and a deploy already
    # talking to the server must never be cancelled half way. (The server
    # takes a lock as well — CI is not the only thing that deploys.)
    concurrency:
      group: frameos-cloud-deploy
      cancel-in-progress: false

    # Every action in this job is pinned to a commit, not a tag: a tag can be
    # moved, and this job ends with the production deploy key on disk. Bump
    # by resolving the new tag (`gh api repos/<o>/<r>/git/ref/tags/<tag>`,
    # dereferencing annotated tags) and updating the trailing comment.
    steps:
      # Full history and the normal remote refspec: scripts/deploy.sh proves
      # the commit it is about to ship exists on the remote before shipping
      # it, which a shallow single-ref checkout cannot answer.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || '' }}

      - name: Fetch the remote branches
        run: |
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch --quiet --prune origin

      # Two merges landing minutes apart both reach this job. The older one
      # would deploy older code over newer, so it stands down: the tip's own
      # run is already queued behind this one on the concurrency group.
      #
      # ...but only when the tip *has* a run. This workflow is path-filtered,
      # so a docs-only commit landing right behind a cloud change leaves no
      # run queued at all: the cloud change's run stood down, nothing ran for
      # the tip, and the fix never reached production (2026-09-05, a frame-hub
      # fix sat unshipped while the bench kept testing against it). When the
      # commits between us and the tip touch none of this workflow's inputs,
      # the tip's cloud is byte-for-byte ours — ship it. deploy.sh resolves
      # `main` from the remote and refuses a tree that is not that commit, so
      # this checks the tip out the way the release path below does.
      #
      # A release is the one case where main having moved on is the *point*:
      # the release run pushed `chore: version X` itself, and no push event
      # exists for that commit to leave a run queued behind us. Standing down
      # there would mean never deploying a release at all, which is the bug
      # this trigger exists to fix — so take whatever main is now.
      - name: Stand down if main has moved on
        id: freshness
        run: |
          set -euo pipefail
          tip="$(git rev-parse origin/main)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # Re-sync to the tip before the wasm build below: deploy.sh
            # resolves `main` from the remote itself, and would otherwise
            # find a tree built from a slightly older commit and refuse it as
            # dirty. Detaching is safe — the deploy is still named `main`
            # (deploy.sh takes the ref from its argument), so --release-ref
            # keeps reporting `main` and the branch guard keeps working.
            git checkout --quiet --detach "$tip"
            echo "release deploy: shipping origin/main at $tip" |
              tee -a "$GITHUB_STEP_SUMMARY"
            echo "sha=$tip" >>"$GITHUB_OUTPUT"
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          elif [ "$tip" != "$GITHUB_SHA" ]; then
            # The release workflow pushes its `chore: version X` with the
            # workflow token, which fires no push run: the only run that
            # commit ever gets is the workflow_run above, and that one skips
            # when the release fails. Standing down in its favour therefore
            # left production on the commit BEFORE this merge until the next
            # successful release (2026-10-10: #521 merged, the release failed
            # on a C3 link error, and the cloud served the pre-#521 bundle
            # for thirteen hours). When everything between us and the tip is
            # such a bump, ship THIS commit — not the tip, whose versions.json
            # names a release whose assets may not exist yet — and record it
            # as `main`, which is what the live-ref check above reads.
            bumps_only=true
            while IFS= read -r line; do
              case "$line" in
                'git@frameos.net chore: version '*) ;;
                *) bumps_only=false ;;
              esac
            done < <(git log --format='%ae %s' "$GITHUB_SHA..$tip")
            if [ "$bumps_only" = true ]; then
              echo "origin/main is now $tip, but only release version bumps separate it from $GITHUB_SHA, and a bump has no push run of its own; shipping $GITHUB_SHA." |
                tee -a "$GITHUB_STEP_SUMMARY"
              {
                echo "sha=$GITHUB_SHA"
                echo "target=$GITHUB_SHA"
                echo "proceed=true"
              } >>"$GITHUB_OUTPUT"
            # The same list as `on.push.paths` above; keep the two in step.
            elif git diff --name-only "$GITHUB_SHA" "$tip" | grep -qE \
                '^(cloud/|frontend/|cloud-frontend/|repo/|frameos/wasm/|frameos/editor/|versions\.json$|release-assets/firmware-signing\.pub$|turbo\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/cloud-ci\.yml$)'; then
              echo "origin/main is now $tip, not $GITHUB_SHA, and that commit has its own run; leaving the deploy to it." |
                tee -a "$GITHUB_STEP_SUMMARY"
              echo "proceed=false" >>"$GITHUB_OUTPUT"
            else
              git checkout --quiet --detach "$tip"
              echo "origin/main moved on to $tip by commits outside this workflow's inputs; shipping the tip (same cloud as $GITHUB_SHA)." |
                tee -a "$GITHUB_STEP_SUMMARY"
              echo "sha=$tip" >>"$GITHUB_OUTPUT"
              echo "proceed=true" >>"$GITHUB_OUTPUT"
            fi
          else
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          fi
          # What deploy.sh is handed: `main` (resolved from the remote) unless
          # the bump case above pinned a commit.
          grep -q '^target=' "$GITHUB_OUTPUT" || echo "target=main" >>"$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.freshness.outputs.proceed == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.freshness.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # verify just wrote this exact key, so the build below is mostly cache
      # replay rather than a second full build of the frontend.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.freshness.outputs.proceed == 'true'
        with:
          path: .turbo
          key: turbo-cloud-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-cloud-${{ runner.os }}-

      - name: Install dependencies
        if: steps.freshness.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # The wasm runtime is not built here: `pnpm deploy:prod` below runs
      # auth-web's prebuild, which installs the signed bundle of the release
      # pinned in versions.json (scripts/lib/wasm-runtime.mjs). A deploy
      # between a release's version bump and its assets landing fails on
      # that download and is simply re-run.

      # Written only now, after every third-party action in this job has
      # run: the key is root on the production box, and nothing that is
      # not ours should execute with it on disk.
      - name: Configure SSH
        if: steps.freshness.outputs.proceed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.FRAMEOS_CLOUD_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FRAMEOS_CLOUD_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "FRAMEOS_CLOUD_DEPLOY_KEY is not set" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "FRAMEOS_CLOUD_DEPLOY_KNOWN_HOSTS is not set" >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/frameos-cloud-deploy
          chmod 600 ~/.ssh/frameos-cloud-deploy
          # Pinned, never learned on first use: an unauthenticated host key is
          # a deploy bundle handed to whoever answers the address.
          printf '%s\n' "$KNOWN_HOSTS" >>~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Absolute: deploy.sh passes this to `ssh -i "$ssh_key"` quoted, and
          # a literal ~ inside quotes is a path that does not exist.
          echo "FRAMEOS_CLOUD_DEPLOY_SSH_KEY=$HOME/.ssh/frameos-cloud-deploy" >>"$GITHUB_ENV"


      # Production is allowed to run a branch — some frame-facing work can
      # only be exercised against the real cloud — and an automatic deploy
      # must not silently take that away while someone is using it. Deploying
      # main by hand when you are done re-arms this.
      # Runs here, after Configure SSH, because it is the first thing that
      # needs the key; the install above is wasted when it stands down,
      # which is the cheaper side of "the key is on disk only after every
      # third-party action in the job".
      - name: Stand down if production is running a branch
        id: live
        if: steps.freshness.outputs.proceed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.FRAMEOS_CLOUD_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          live_ref="$(ssh -i ~/.ssh/frameos-cloud-deploy -o BatchMode=yes \
            "$DEPLOY_HOST" frameos-cloud-update --release-ref)"
          echo "production is running: $live_ref"
          if [ "$live_ref" = "main" ]; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          else
            {
              echo "### Auto-deploy on hold"
              echo
              echo "Production is running \`$live_ref\`, not \`main\`, so this merge was **not** deployed."
              echo "Run \`pnpm deploy:prod\` from cloud/ when you are done with that ref to resume."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          fi

      # The same script a human runs. `-- main` rather than the bare form so
      # the server records the ref as "main": that is what the branch check
      # above reads on the next merge. The bump case pins a commit instead,
      # and FRAMEOS_CLOUD_DEPLOY_RELEASE_NAME keeps the record saying "main".
      - name: Deploy
        if: steps.live.outputs.proceed == 'true'
        working-directory: cloud
        env:
          FRAMEOS_CLOUD_DEPLOY_HOST: ${{ secrets.FRAMEOS_CLOUD_DEPLOY_HOST }}
          FRAMEOS_CLOUD_DEPLOY_RELEASE_NAME: main
          DEPLOY_TARGET: ${{ steps.freshness.outputs.target }}
          # FRAMEOS_CLOUD_DEPLOY_SSH_KEY comes from the Configure SSH step.
        run: pnpm deploy:prod -- "$DEPLOY_TARGET"

      - name: Summarise
        if: steps.live.outputs.proceed == 'true' && success()
        env:
          # Not $GITHUB_SHA: on a release-triggered run that is the event's
          # commit, not the tip this job resolved and shipped.
          DEPLOYED_SHA: ${{ steps.freshness.outputs.sha }}
        run: |
          {
            echo "### Deployed to production"
            echo
            echo "\`main\` at \`$DEPLOYED_SHA\` is live at https://cloud.frameos.net"
            echo
            echo "Roll back with \`ssh <host> frameos-cloud-update --rollback\`."
          } >>"$GITHUB_STEP_SUMMARY"

      # Nobody is watching an unattended deploy, so a failed one has to come
      # find you. Optional: without the webhook the job still fails visibly in
      # Actions, it just does so quietly.
      - name: Report a failed deploy
        if: failure() && steps.freshness.outputs.proceed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.FRAMEOS_CLOUD_DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "No FRAMEOS_CLOUD_DEPLOY_WEBHOOK_URL configured; not notifying."
            exit 0
          fi
          # python writes the payload (it escapes the content correctly), curl
          # sends it — the same split as discord-release.yml. Not urllib:
          # Discord answers its user agent with a 403, so a notifier written
          # that way is a notifier that only fails when you need it.
          python3 - <<'PY'
          import json, os

          content = (
              ":rotating_light: **FrameOS Cloud deploy failed**\n"
              f"`main` at `{os.environ['GITHUB_SHA'][:12]}`\n"
              f"{os.environ['RUN_URL']}\n"
              "Production is untouched unless the log says otherwise; "
              "`frameos-cloud-update --status` on the box is the source of truth."
          )
          with open("discord-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump({"content": content, "allowed_mentions": {"parse": []}}, payload_file)
          PY
          curl --fail-with-body --show-error --silent \
            -H "Content-Type: application/json" \
            --data @discord-payload.json \
            "$WEBHOOK_URL"
          rm -f discord-payload.json

  # A verify that fails on main stops the deploy job before its first step, so
  # the report above never runs and the merge just quietly does not ship
  # (2026-11-09: #712 merged, and production stayed on the commit before it).
  # This goes to PostHog, whose `cloud ops alert` workflow posts to Discord.
  report-undeployed:
    name: Report a main that was not deployed
    needs: [verify, integration]
    if: >-
      failure() &&
      (github.event_name == 'push' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tell PostHog
        env:
          POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${POSTHOG_KEY:-}" ]; then
            echo "No NEXT_PUBLIC_POSTHOG_KEY variable; not notifying."
            exit 0
          fi
          python3 - <<'PY'
          import json, os

          payload = {
              "api_key": os.environ["POSTHOG_KEY"],
              "distinct_id": "frameos-cloud-ci",
              "event": "cloud ops alert",
              "properties": {
                  "$lib": "frameos-cloud-ci",
                  "kind": "main_not_deployed",
                  "sha": os.environ["GITHUB_SHA"][:12],
                  "source": "ci",
                  "summary": "Cloud CI failed on main, so this merge was not deployed.",
                  "url": os.environ["RUN_URL"],
              },
          }
          with open("posthog-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump(payload, payload_file)
          PY
          curl --fail-with-body --show-error --silent \
            -H "Content-Type: application/json" \
            --data @posthog-payload.json \
            https://eu.i.posthog.com/capture/
