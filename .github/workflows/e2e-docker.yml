name: E2E Docker Image

# Pull requests into any branch, so a PR stacked on another one gets the
# ESP32 build and its size comment too; the Docker image job stays on PRs
# into main.
on:
  pull_request:
    branches:
      - '**'
  push:
    branches: [ "main" ]
    paths-ignore:
      - buildroot-images.json
      - cross-toolchain-images.json

# Superseded runs on the same PR are cancelled; pushes to main always run to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares its own least-privilege token; this is the floor for
# any job that forgets to.
permissions:
  contents: read

jobs:
  # Which of the jobs below this pull request needs (.github/ci/changed_areas.py:
  # the rules, and why each is safe). Pushes run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.areas.outputs.docker }}
      esp32: ${{ steps.areas.outputs.esp32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
      - name: Classify the changed files
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/ci/changed_areas.py

  docker_image:
    name: Build Docker Image
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && needs.changes.outputs.docker == 'true' }}
    # A 16-core slot of the self-hosted pool (tools/gha-runners/README.md);
    # pull requests from forks stay on GitHub-hosted runners.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Reads the layer caches of this image: main's (seed_runtime_cache,
      # every push) first, the release's (docker-publish-multi.yml) when
      # main's has nothing yet. The toolchains, emsdk and the dependency
      # installs come from them, and only what this commit changed is built.
      # The release's alone went stale with every lockfile change on main
      # between releases (pnpm fetch onward, ~5 minutes a run). Read-only on
      # the package on every event; a login that gets nothing (a fork) is a
      # cold build, not a failure.
      - name: Login to GHCR
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build --target runtime -t frameos \
            --cache-from type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-amd64-main \
            --cache-from type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-amd64 .

      - name: Run Docker container
        run: |
          docker run -d \
            -p 8989:8989 \
            -v ./db:/app/db \
            --name frameos \
            --restart always \
            -e SECRET_KEY="bananana" \
            frameos

      - name: Wait for service on port 8989
        run: |
          echo "Waiting up to 30s for the service to respond on port 8989..."
          if ! timeout 30 bash -c "until curl -s http://localhost:8989; do sleep 1; done"; then
            echo "Service did not become ready in time. Printing container logs:"
            docker logs frameos || true
            exit 1
          fi

      - name: Test /signup endpoint
        id: signup-test
        run: |
          # We'll capture the HTTP status code so we can fail the step if it's not 2xx
          echo "Testing /api/signup with a sample payload..."
          HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST http://localhost:8989/api/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"asdfasdf","password2":"asdfasdf","newsletter":false}')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Signup request failed with status code $HTTP_CODE"
            exit 1
          else
            echo "Signup request succeeded with status code $HTTP_CODE"
          fi

  # The ONLY writer of the esp32-ci layer cache, and it runs on pushes to
  # main alone. A pull request runs the workflow file from its own branch,
  # so any job a pull request can reach must not hold `packages: write`:
  # with it, a same-repo PR could rewrite a step and push layers that the
  # next main build — and from there the release firmware and runtime image
  # — would silently reuse. Keeping the write here, behind the event, closes
  # that; the package can stay private, nothing needs it public. The build
  # itself is the one the firmware job below runs, minus loading the image:
  # on a main push both run side by side, this one refreshing the cache for
  # the next run, the firmware job reading the previous one.
  seed_esp32_cache:
    name: Refresh the esp32-ci layer cache
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context and target as every reader of this tag (the firmware
      # job below, the release's three esp32-ci builds), so what is written
      # here is what they hit. mode=max keeps every stage's layers, the
      # toolchain ones included; a run with no cache yet builds cold and
      # seeds it.
      - name: Build ESP32 CI Docker image and export its layers
        uses: docker/build-push-action@v6
        with:
          context: .
          target: esp32-ci
          push: false
          load: false
          cache-from: type=registry,ref=ghcr.io/frameos/frameos-build-cache:esp32-ci
          cache-to: type=registry,ref=ghcr.io/frameos/frameos-build-cache:esp32-ci,mode=max

  # The layer cache the Docker image job above reads first, written on pushes
  # to main only, for the reason seed_esp32_cache gives: a job a pull request
  # can reach must not hold `packages: write`. mode=max keeps every stage's
  # layers, so a pull request rebuilds from its own first change on.
  seed_runtime_cache:
    name: Refresh the runtime image layer cache
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the runtime image and export its layers
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: false
          cache-from: |
            type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-amd64-main
            type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-amd64
          cache-to: type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-amd64-main,mode=max

  esp32_firmware_image:
    name: ESP32 firmware (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.esp32 == 'true'
    # A 16-core slot of the self-hosted pool; pull requests from forks stay on
    # GitHub-hosted runners. Three legs side by side, where one job built the
    # three images one after another (they share no object file, and a
    # firmware build is one Nim compile and one IDF build).
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    # Read-only on the package, on every event: this job is reachable from
    # a pull request (see seed_esp32_cache for why that rules out write).
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The generic 8 MB image, its size document and the host tests.
          - leg: esp32-s3
            platform: esp32-s3
            build_dir: build-ci
            qemu: '0'
            size: esp32-s3
          # Booted in QEMU.
          - leg: qemu
            platform: esp32-s3
            build_dir: build-ci-qemu
            qemu: '1'
            size: ''
          # The 32MB layout (13.3E6-class boards) — build-validated here
          # because no release job covers it.
          - leg: esp32-s3-32mb
            platform: esp32-s3-32mb
            build_dir: build-ci-32mb
            qemu: '0'
            size: esp32-s3-32mb
    steps:
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The firmware compiles QuickJS from source (for the chip, and a host
      # copy for the prelude bytecode), so not the prebuilt host library
      # `nimble build_quickjs` installs: the pinned source tarball, checked
      # against frameos.nimble's sha256, as the image's app-builder stage and
      # build_quickjs's own fallback fetch it.
      - name: QuickJS sources
        run: |
          version="$(sed -n 's/^ *QuickjsVersion = "\(.*\)"$/\1/p' frameos/frameos.nimble)"
          sha="$(sed -n 's/^ *QuickjsSha256 = "\(.*\)"$/\1/p' frameos/frameos.nimble)"
          test -n "$version" && test -n "$sha"
          curl -fsSL --retry 3 "https://archive.frameos.net/source/vendor/quickjs-$version.tar.xz" -o "$RUNNER_TEMP/quickjs.tar.xz"
          echo "$sha  $RUNNER_TEMP/quickjs.tar.xz" | sha256sum -c -
          rm -rf frameos/quickjs
          tar -xf "$RUNNER_TEMP/quickjs.tar.xz" -C frameos
          mv "frameos/quickjs-$version" frameos/quickjs

      # Same key as the Nim shards' (the inputs prepare_assets.py fingerprints):
      # on a hit `nimble assets` finds the frame's compiled assets current.
      - name: Cache compiled assets
        uses: actions/cache@v4
        with:
          path: |
            frameos/assets/compiled
            frameos/src/assets
          key: ${{ runner.os }}-frameos-assets-${{ hashFiles('frameos/frontend/**', 'frameos/tools/prepare_assets.py', 'frameos/tools/generate_*.py', 'frontend/src/**', 'frontend/schema/**', 'frontend/public/**', 'frontend/scripts/generateRepoApps.mjs', 'frontend/package.json', 'repo/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'versions.json') }}

      # What the image's app-builder stage did for the firmware, on the runner:
      # the nimble packages (nimble.paths names them by absolute path, and the
      # container mounts them at the same one) and the compiled assets.
      - name: Prepare the tree
        run: |
          cd frameos
          nimble install -d
          nimble setup
          nimble assets

      # The Dockerfile's esp-idf-toolchain stage, under a tag that hashes its
      # lines (embedded/esp32/ci_toolchain_image.sh). The pool's VM image
      # carries main's; otherwise it is built from the esp32-ci registry layer
      # cache seed_esp32_cache keeps (mode=max, so every stage's layers).
      - name: Look for the toolchain image
        id: toolchain
        run: |
          tag="$(bash embedded/esp32/ci_toolchain_image.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker image inspect "$tag" > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "toolchain image $tag is in the runner image"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Reads a private package: a same-repo pull request's token can, a
      # fork's read-only token can too once the package is linked to the
      # repository, and a login that gets nothing simply means a cold build.
      - name: Login to GHCR
        if: steps.toolchain.outputs.present != 'true'
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the toolchain image
        if: steps.toolchain.outputs.present != 'true'
        env:
          TAG: ${{ steps.toolchain.outputs.tag }}
        run: |
          docker build --target esp-idf-toolchain -t "$TAG" \
            --cache-from type=registry,ref=ghcr.io/frameos/frameos-build-cache:esp32-ci .

      # ESP-IDF's ccache, one archive per leg in the pool's shared cache
      # (frameos/tools/ci_nimcache.sh, which keeps any directory as one
      # archive). A stale entry only costs misses: ccache hashes the compiler,
      # flags and source. Written by pushes to main only, like the nimcache.
      - name: Restore ccache
        env:
          FRAMEOS_NIMCACHE_ROOT: /mnt/cache/ccache/esp32
          FRAMEOS_NIMCACHE_DIR: ${{ github.workspace }}/.ccache
        run: bash frameos/tools/ci_nimcache.sh restore ${{ matrix.leg }}

      # The checkout, the nimble packages and Nim are mounted at the paths the
      # runner has them at, so nimble.paths and the toolchain resolve in the
      # container as they do outside it.
      - name: Build the firmware
        timeout-minutes: 30
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_DIR: ${{ matrix.build_dir }}
          QEMU: ${{ matrix.qemu }}
          SIZE: ${{ matrix.size }}
          TAG: ${{ steps.toolchain.outputs.tag }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ccache" "$GITHUB_WORKSPACE/.firmware-size"
          # The firmware version comes from the checkout. ci_build_image.sh
          # refuses to build without one — a firmware that misreports its
          # version re-flashes itself on every OTA check (see the guard).
          FRAMEOS_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["frameos"].split("+")[0])')"
          # The real toolchain, not ~/.nimble/bin: on a GitHub-hosted runner
          # those are choosenim shims that look for ~/.choosenim under the
          # container's HOME.
          nim_bin="$HOME/.choosenim/toolchains/nim-2.2.4/bin"
          test -x "$nim_bin/nim"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -v "$HOME/.nimble:$HOME/.nimble:ro" -v "$HOME/.choosenim:$HOME/.choosenim:ro" \
            -e FRAMEOS_NIM_BIN_DIR="$nim_bin" \
            -e FRAMEOS_SELECTED_PANEL=EPD_7in5_V2 \
            -e FRAMEOS_VERSION="$FRAMEOS_VERSION" \
            -e FRAMEOS_ESP32_PLATFORM="$PLATFORM" \
            -e FRAMEOS_ESP32_BUILD_DIR="$BUILD_DIR" \
            -e FRAMEOS_ESP32_QEMU="$QEMU" \
            -e IDF_CCACHE_ENABLE=1 \
            -e CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" \
            -e CCACHE_MAXSIZE=2G \
            "$TAG" \
            bash -lc 'set -euo pipefail; bash embedded/esp32/ci_build_image.sh; ccache --show-stats || true'
          if [ -n "$SIZE" ]; then
            cp "embedded/esp32/$BUILD_DIR/firmware-size.json" ".firmware-size/$SIZE.json"
          fi
          # The container writes as root; the steps after it run as the runner.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      # The IDF-free modules' host tests (embedded/esp32/main/tests), once.
      - name: Host tests
        if: matrix.leg == 'esp32-s3'
        env:
          TAG: ${{ steps.toolchain.outputs.tag }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$TAG" bash -s <<'TESTS'
          set -euo pipefail
          # The cloud verb contract, as the firmware walks it, against the
          # conformance corpus the Linux runtime and the cloud also run
          # (docs/cloud-frames-fixtures.json). Host-built: pure cJSON, no IDF.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            -I"$IDF_PATH/components/json/cJSON" "$IDF_PATH/components/json/cJSON/cJSON.c" \
            embedded/esp32/main/fos_cloud_contract.c embedded/esp32/main/tests/test_fos_cloud_contract.c \
            -lm -o /tmp/test_fos_cloud_contract
          /tmp/test_fos_cloud_contract docs/cloud-frames-fixtures.json
          # Which keys the event map of a frame makes voice keys
          # (docs/voice-chat.md): pure cJSON as well.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            -I"$IDF_PATH/components/json/cJSON" "$IDF_PATH/components/json/cJSON/cJSON.c" \
            embedded/esp32/main/fos_voice_binding.c embedded/esp32/main/tests/test_fos_voice_binding.c \
            -lm -o /tmp/test_fos_voice_binding
          /tmp/test_fos_voice_binding
          # The per-scene store on the state partition: pure C and cJSON.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            -I"$IDF_PATH/components/json/cJSON" "$IDF_PATH/components/json/cJSON/cJSON.c" \
            embedded/esp32/main/fos_json_guard.c embedded/esp32/main/fos_scene_store.c \
            embedded/esp32/main/tests/test_fos_scene_store.c \
            -lm -o /tmp/test_fos_scene_store
          /tmp/test_fos_scene_store
          # The SPIFFS garbage collection order and the scene store split,
          # replayed on the SPIFFS that ESP-IDF ships (fos_spiffs_gc.c, a
          # 20-scene set pushed over itself on a 1 MB /state). The backend
          # pytest runner skips it where no IDF checkout is around.
          mkdir -p /tmp/spiffs_obj
          for f in spiffs_cache spiffs_check spiffs_gc spiffs_hydrogen spiffs_nucleus; do \
            cc -std=c11 -O2 -w -Iembedded/esp32/main -Iembedded/esp32/main/tests/spiffs_shim \
              -I"$IDF_PATH/components/spiffs/include" -I"$IDF_PATH/components/spiffs/spiffs/src" \
              -c "$IDF_PATH/components/spiffs/spiffs/src/$f.c" -o /tmp/spiffs_obj/$f.o || exit 1; done
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main -Iembedded/esp32/main/tests/spiffs_shim \
            -I"$IDF_PATH/components/spiffs/include" -I"$IDF_PATH/components/spiffs/spiffs/src" \
            -D__real_SPIFFS_gc=SPIFFS_gc \
            embedded/esp32/main/fos_spiffs_gc.c embedded/esp32/main/fos_spiffs_footprint.c \
            embedded/esp32/main/tests/test_fos_spiffs_gc.c /tmp/spiffs_obj/*.o \
            -o /tmp/test_fos_spiffs_gc
          /tmp/test_fos_spiffs_gc
          # The JSON depth pre-scan that guards the 8-10 KB parser tasks.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_json_guard.c embedded/esp32/main/tests/test_fos_json_guard.c \
            -o /tmp/test_fos_json_guard
          /tmp/test_fos_json_guard
          # sscanf without the floating-point scanf: the cJSON "%lg"
          # read-back goes to strtod (fos_sscanf.c, the --wrap=sscanf).
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_sscanf.c embedded/esp32/main/tests/test_fos_sscanf.c \
            -o /tmp/test_fos_sscanf
          /tmp/test_fos_sscanf
          # Upload bounds + usb_api payload timeout math (fos_upload_limits.h).
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/tests/test_fos_upload_limits.c \
            -o /tmp/test_fos_upload_limits
          /tmp/test_fos_upload_limits
          # The IDF-free security boundaries, each a plain-C module so it
          # can be argued about on a laptop (main/tests/*.c carry the same
          # command lines): the assets-path rule behind every asset verb,
          # the provider URL / transport / origin rules, the minisign
          # parser that gates OTA, the setting parsers, and the schedule
          # catch-up window.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_assets_path.c embedded/esp32/main/tests/test_fos_assets_path.c \
            -o /tmp/test_fos_assets_path
          /tmp/test_fos_assets_path
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_url_guard.c embedded/esp32/main/tests/test_fos_url_guard.c \
            -o /tmp/test_fos_url_guard
          /tmp/test_fos_url_guard
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            -Iembedded/esp32/components/monocypher \
            embedded/esp32/main/fos_minisig.c embedded/esp32/main/tests/test_fos_minisig.c \
            embedded/esp32/components/monocypher/monocypher.c \
            embedded/esp32/components/monocypher/monocypher-ed25519.c \
            -o /tmp/test_fos_minisig
          /tmp/test_fos_minisig
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            -Iembedded/esp32/main/tests/host_shim \
            embedded/esp32/main/fos_config_parse.c embedded/esp32/main/tests/test_fos_config_parse.c \
            -o /tmp/test_fos_config_parse
          /tmp/test_fos_config_parse
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/tests/test_fos_schedule_catchup.c \
            -o /tmp/test_fos_schedule_catchup
          /tmp/test_fos_schedule_catchup
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/tests/test_fos_console_line.c \
            -o /tmp/test_fos_console_line
          /tmp/test_fos_console_line
          # The hold of a voice key (docs/voice-chat.md), pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_voice_hold.c embedded/esp32/main/tests/test_fos_voice_hold.c \
            -o /tmp/test_fos_voice_hold
          /tmp/test_fos_voice_hold
          # Animation mode pacing: a scene below a one-second interval on an LCD, pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_animation.c embedded/esp32/main/tests/test_fos_animation.c \
            -o /tmp/test_fos_animation
          /tmp/test_fos_animation
          # Which scene a frame starts on: never a layout, pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_boot_scene.c embedded/esp32/main/tests/test_fos_boot_scene.c \
            -o /tmp/test_fos_boot_scene
          /tmp/test_fos_boot_scene
          # When an e-paper panel takes a partial update, pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/components/frameos_display/include \
            embedded/esp32/components/frameos_display/fos_partial_refresh.c embedded/esp32/main/tests/test_fos_partial_refresh.c \
            -o /tmp/test_fos_partial_refresh
          /tmp/test_fos_partial_refresh
          # The charger register decode, the RTC conversions, the fuel gauge decode
          # and the climate sensor decode, pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_charger.c embedded/esp32/main/fos_rtc.c embedded/esp32/main/fos_gauge.c \
            embedded/esp32/main/fos_climate.c embedded/esp32/main/tests/test_fos_i2c_devices.c \
            -o /tmp/test_fos_i2c_devices
          /tmp/test_fos_i2c_devices
          # The IT8951 panel rows (the reTerminal E1003, the Waveshare 10.3 inch HAT), pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/components/frameos_display/include \
            embedded/esp32/components/frameos_display/it8951.c embedded/esp32/main/tests/test_fos_it8951.c \
            -o /tmp/test_fos_it8951
          /tmp/test_fos_it8951
          # The touch panel report decode and wire scaling, pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_touch.c embedded/esp32/main/tests/test_fos_touch.c \
            -o /tmp/test_fos_touch
          /tmp/test_fos_touch
          # The render pull of a frame rendered on the server (docs/server-rendering.md), pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_render_pull.c embedded/esp32/main/tests/test_fos_render_pull.c \
            -o /tmp/test_fos_render_pull
          /tmp/test_fos_render_pull
          # What a frame rendered on the server relays to its plane with the pull, pure.
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iembedded/esp32/main \
            embedded/esp32/main/fos_render_relay.c embedded/esp32/main/fos_json_guard.c \
            embedded/esp32/main/tests/test_fos_render_relay.c \
            -o /tmp/test_fos_render_relay
          /tmp/test_fos_render_relay
          TESTS

      - name: Save ccache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          FRAMEOS_NIMCACHE_ROOT: /mnt/cache/ccache/esp32
          FRAMEOS_NIMCACHE_DIR: ${{ github.workspace }}/.ccache
        run: bash frameos/tools/ci_nimcache.sh save ${{ matrix.leg }}

      - name: Upload firmware size documents
        if: matrix.size != ''
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-size-${{ matrix.leg }}
          path: .firmware-size/*.json
          # The directory starts with a dot; without this the action skips it
          # ("No files were found") and the report job fails on download.
          include-hidden-files: true
          if-no-files-found: error

  # Sticky "ESP32 firmware size" comment on the PR: one comment, edited in
  # place on every push, never a commit. Compares this build with the latest
  # GitHub release — per subsystem when that release shipped a size document
  # (releases from this change on do), totals only when it predates one.
  # Separate job so the build keeps `contents: read`; fork PRs get a
  # read-only token, so the comment is only attempted for same-repo PRs.
  esp32_firmware_size_report:
    name: ESP32 firmware size report
    runs-on: ubuntu-latest
    needs: esp32_firmware_image
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: embedded/esp32/tools
          sparse-checkout-cone-mode: false

      - name: Download firmware size documents
        uses: actions/download-artifact@v4
        with:
          pattern: esp32-firmware-size-*
          merge-multiple: true
          path: .firmware-size

      - name: Fetch the latest release as the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .firmware-size/baseline
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > .firmware-size/release.json
          tag="$(jq -r .tagName .firmware-size/release.json)"
          echo "BASELINE_TAG=$tag" >> "$GITHUB_ENV"
          # Size documents published by the release workflow, when present —
          # the generic pair plus one per flash layout, so the 32MB build
          # above diffs against its own baseline rather than none.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-esp32-*-size.json' --dir .firmware-size/baseline || true
          for f in .firmware-size/baseline/*-size.json; do
            [ -f "$f" ] || continue
            platform="$(jq -r .platform "$f")"
            mv "$f" ".firmware-size/baseline/$platform.json"
          done
          # Older releases: totals from the asset byte counts.
          python3 embedded/esp32/tools/firmware_size.py baseline-from-release \
            --release-json .firmware-size/release.json --out-dir .firmware-size/baseline-totals
          for f in .firmware-size/baseline-totals/*.json; do
            [ -f "$f" ] || continue
            [ -f ".firmware-size/baseline/$(basename "$f")" ] || cp "$f" .firmware-size/baseline/
          done
          ls -l .firmware-size .firmware-size/baseline

      - name: Render the report
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          STACKED_NOTE=""
          if [ "$BASE_REF" != "main" ]; then
            STACKED_NOTE=" This PR targets \`$BASE_REF\`, so the difference also counts the PRs it is stacked on."
          fi
          args=()
          for f in .firmware-size/esp32-s3.json .firmware-size/esp32-s3-32mb.json; do
            [ -f "$f" ] && args+=(--current "$f")
          done
          for f in .firmware-size/baseline/*.json; do
            [ -f "$f" ] && args+=(--baseline "$f")
          done
          python3 embedded/esp32/tools/firmware_size.py render "${args[@]}" \
            --baseline-label "${BASELINE_TAG:-latest release}" \
            --intro "Built from ${GITHUB_SHA::7} by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}); compared with the latest release **${BASELINE_TAG:-?}**.${STACKED_NOTE}" \
            --out .firmware-size/comment.md
          cat .firmware-size/comment.md

      - name: Create or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- frameos-esp32-firmware-size -->'
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@.firmware-size/comment.md > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@.firmware-size/comment.md > /dev/null
            echo "created comment"
          fi

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - changes
      - docker_image
      - esp32_firmware_image
    if: ${{ always() }}
    steps:
      - name: Check parallel jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCKER: ${{ needs.docker_image.result }}
          DOCKER_NEEDED: ${{ needs.changes.outputs.docker }}
          ESP32: ${{ needs.esp32_firmware_image.result }}
          ESP32_NEEDED: ${{ needs.changes.outputs.esp32 }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "The change classification finished with result: $CHANGES"
            exit 1
          fi
          docker_result="$DOCKER"
          # Skipped by design on a PR stacked on another branch (see
          # docker_image), and when the change touches nothing it builds.
          if [ "$docker_result" = "skipped" ]; then
            if { [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" != "main" ]; } || [ "$DOCKER_NEEDED" = "false" ]; then
              docker_result=success
            fi
          fi
          if [ "$docker_result" != "success" ]; then
            echo "Docker image job finished with result: $DOCKER"
            exit 1
          fi
          esp32_result="$ESP32"
          if [ "$esp32_result" = "skipped" ] && [ "$ESP32_NEEDED" = "false" ]; then
            esp32_result=success
          fi
          if [ "$esp32_result" != "success" ]; then
            echo "ESP32 firmware image job finished with result: $ESP32"
            exit 1
          fi
