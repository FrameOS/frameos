name: E2E Docker Image

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths-ignore:
      - buildroot-images.json
      - cross-toolchain-images.json

# Superseded runs on the same PR are cancelled; pushes to main always run to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --target runtime -t frameos .

      - name: Run Docker container
        run: |
          docker run -d \
            -p 8989:8989 \
            -v ./db:/app/db \
            --name frameos \
            --restart always \
            -e SECRET_KEY="bananana" \
            frameos

      - name: Wait for service on port 8989
        run: |
          echo "Waiting up to 30s for the service to respond on port 8989..."
          if ! timeout 30 bash -c "until curl -s http://localhost:8989; do sleep 1; done"; then
            echo "Service did not become ready in time. Printing container logs:"
            docker logs frameos || true
            exit 1
          fi

      - name: Test /signup endpoint
        id: signup-test
        run: |
          # We'll capture the HTTP status code so we can fail the step if it's not 2xx
          echo "Testing /api/signup with a sample payload..."
          HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST http://localhost:8989/api/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"asdfasdf","password2":"asdfasdf","newsletter":false}')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Signup request failed with status code $HTTP_CODE"
            exit 1
          else
            echo "Signup request succeeded with status code $HTTP_CODE"
          fi

  esp32_firmware_image:
    name: Build and boot ESP32 firmware image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Token auth, same as the release workflow: OIDC would spare us the
      # secret, but it needs a trust relationship configured in the Depot
      # project first (until then the exchange dies with permission_denied).
      # Secrets are absent on forked PRs, so those fall back to a plain
      # docker build below.
      DEPOT_AVAILABLE: ${{ secrets.DEPOT_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Depot CLI
        if: env.DEPOT_AVAILABLE == 'true'
        uses: depot/setup-action@v1

      # Depot keeps a persistent layer cache per project, so the esp32-ci
      # target (ESP-IDF toolchain + Nim) only rebuilds layers that changed.
      # load: true pulls the image into the local Docker daemon for the
      # `docker run` below.
      - name: Build ESP32 CI Docker image (Depot)
        if: env.DEPOT_AVAILABLE == 'true'
        uses: depot/build-push-action@v1
        with:
          project: rsbh2wrlkj
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          target: esp32-ci
          tags: frameos-esp32-ci
          load: true
          push: false

      - name: Build ESP32 CI Docker image (forked PR fallback)
        if: env.DEPOT_AVAILABLE != 'true'
        run: |
          docker build --target esp32-ci -t frameos-esp32-ci .

      - name: Build and boot ESP32 firmware image
        timeout-minutes: 60
        run: |
          docker run --rm \
            -e FRAMEOS_SELECTED_PANEL=EPD_7in5_V2 \
            frameos-esp32-ci \
            bash -lc '
              set -euo pipefail
              bash embedded/esp32/ci_build_image.sh
              FRAMEOS_ESP32_QEMU=1 FRAMEOS_ESP32_BUILD_DIR=build-ci-qemu \
                bash embedded/esp32/ci_build_image.sh
            '

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs:
      - docker_image
      - esp32_firmware_image
    if: ${{ always() }}
    steps:
      - name: Check parallel jobs
        run: |
          if [ "${{ needs.docker_image.result }}" != "success" ]; then
            echo "Docker image job finished with result: ${{ needs.docker_image.result }}"
            exit 1
          fi
          if [ "${{ needs.esp32_firmware_image.result }}" != "success" ]; then
            echo "ESP32 firmware image job finished with result: ${{ needs.esp32_firmware_image.result }}"
            exit 1
          fi
