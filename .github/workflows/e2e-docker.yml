name: E2E Docker Image

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths-ignore:
      - buildroot-images.json
      - cross-toolchain-images.json

# Superseded runs on the same PR are cancelled; pushes to main always run to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --target runtime -t frameos .

      - name: Run Docker container
        run: |
          docker run -d \
            -p 8989:8989 \
            -v ./db:/app/db \
            --name frameos \
            --restart always \
            -e SECRET_KEY="bananana" \
            frameos

      - name: Wait for service on port 8989
        run: |
          echo "Waiting up to 30s for the service to respond on port 8989..."
          if ! timeout 30 bash -c "until curl -s http://localhost:8989; do sleep 1; done"; then
            echo "Service did not become ready in time. Printing container logs:"
            docker logs frameos || true
            exit 1
          fi

      - name: Test /signup endpoint
        id: signup-test
        run: |
          # We'll capture the HTTP status code so we can fail the step if it's not 2xx
          echo "Testing /api/signup with a sample payload..."
          HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST http://localhost:8989/api/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"asdfasdf","password2":"asdfasdf","newsletter":false}')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Signup request failed with status code $HTTP_CODE"
            exit 1
          else
            echo "Signup request succeeded with status code $HTTP_CODE"
          fi

  esp32_firmware_image:
    name: Build and boot ESP32 firmware image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Token auth, same as the release workflow: OIDC would spare us the
      # secret, but it needs a trust relationship configured in the Depot
      # project first (until then the exchange dies with permission_denied).
      # Secrets are absent on forked PRs, so those fall back to a plain
      # docker build below.
      DEPOT_AVAILABLE: ${{ secrets.DEPOT_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Depot CLI
        if: env.DEPOT_AVAILABLE == 'true'
        uses: depot/setup-action@v1

      # Depot keeps a persistent layer cache per project, so the esp32-ci
      # target (ESP-IDF toolchain + Nim) only rebuilds layers that changed.
      # load: true pulls the image into the local Docker daemon for the
      # `docker run` below.
      #
      # Keep the cache-relevant inputs (project, context, target, build-args,
      # platforms) identical to the esp32-ci build in docker-publish-multi.yml
      # — this job runs on every push to main and is what warms the release
      # build's cache.
      - name: Build ESP32 CI Docker image (Depot)
        if: env.DEPOT_AVAILABLE == 'true'
        uses: depot/build-push-action@v1
        with:
          project: rsbh2wrlkj
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          target: esp32-ci
          tags: frameos-esp32-ci
          load: true
          push: false

      - name: Build ESP32 CI Docker image (forked PR fallback)
        if: env.DEPOT_AVAILABLE != 'true'
        run: |
          docker build --target esp32-ci -t frameos-esp32-ci .

      # The step below builds the firmware three times (8 MB, QEMU, 32 MB).
      # They share a nimcache but not a single object file, and ESP-IDF ships
      # ccache support that was simply never switched on — so every run
      # recompiled all of ESP-IDF three times over. The cache is keyed loosely
      # and restored from any previous run: a stale entry only costs misses,
      # never correctness, since ccache hashes the compiler, flags and source.
      - name: Cache ESP-IDF ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-esp32-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp32-ccache-

      - name: Build and boot ESP32 firmware image
        timeout-minutes: 60
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          # The esp32-ci image does not carry versions.json (only the
          # app-builder stage copies it), so the firmware version has to come
          # from the runner's checkout. ci_build_image.sh refuses to build
          # without one — a firmware that misreports its version re-flashes
          # itself on every OTA check (see the guard's comment).
          FRAMEOS_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["frameos"].split("+")[0])')"
          docker run --rm \
            -e FRAMEOS_SELECTED_PANEL=EPD_7in5_V2 \
            -e FRAMEOS_VERSION="$FRAMEOS_VERSION" \
            -e IDF_CCACHE_ENABLE=1 \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=2G \
            -v "$GITHUB_WORKSPACE/.ccache:/ccache" \
            frameos-esp32-ci \
            bash -lc '
              set -euo pipefail
              bash embedded/esp32/ci_build_image.sh
              FRAMEOS_ESP32_QEMU=1 FRAMEOS_ESP32_BUILD_DIR=build-ci-qemu \
                bash embedded/esp32/ci_build_image.sh
              # The 32MB layout (13.3E6-class boards) — build-validated here
              # because no release job covers it. Same S3 nimcache, so the
              # incremental cost is one IDF configure+link.
              FRAMEOS_ESP32_PLATFORM=esp32-s3-32mb FRAMEOS_ESP32_BUILD_DIR=build-ci-32mb \
                bash embedded/esp32/ci_build_image.sh
              cp embedded/esp32/build-ci/firmware-size.json /firmware-size/esp32-s3.json || true
              cp embedded/esp32/build-ci-32mb/firmware-size.json /firmware-size/esp32-s3-32mb.json || true
              ccache --show-stats || true
            '
          # The container writes as root; actions/cache runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/.ccache" "$GITHUB_WORKSPACE/.firmware-size"

      - name: Upload firmware size documents
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-size
          path: .firmware-size/*.json
          if-no-files-found: warn

  # Sticky "ESP32 firmware size" comment on the PR: one comment, edited in
  # place on every push, never a commit. Compares this build with the latest
  # GitHub release — per subsystem when that release shipped a size document
  # (releases from this change on do), totals only when it predates one.
  # Separate job so the build keeps `contents: read`; fork PRs get a
  # read-only token, so the comment is only attempted for same-repo PRs.
  esp32_firmware_size_report:
    name: ESP32 firmware size report
    runs-on: ubuntu-latest
    needs: esp32_firmware_image
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: embedded/esp32/tools
          sparse-checkout-cone-mode: false

      - name: Download firmware size documents
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-size
          path: .firmware-size

      - name: Fetch the latest release as the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .firmware-size/baseline
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > .firmware-size/release.json
          tag="$(jq -r .tagName .firmware-size/release.json)"
          echo "BASELINE_TAG=$tag" >> "$GITHUB_ENV"
          # Size documents published by the release workflow, when present.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-esp32-*-generic-size.json' --dir .firmware-size/baseline || true
          for f in .firmware-size/baseline/*-size.json; do
            [ -f "$f" ] || continue
            platform="$(jq -r .platform "$f")"
            mv "$f" ".firmware-size/baseline/$platform.json"
          done
          # Older releases: totals from the asset byte counts.
          python3 embedded/esp32/tools/firmware_size.py baseline-from-release \
            --release-json .firmware-size/release.json --out-dir .firmware-size/baseline-totals
          for f in .firmware-size/baseline-totals/*.json; do
            [ -f "$f" ] || continue
            [ -f ".firmware-size/baseline/$(basename "$f")" ] || cp "$f" .firmware-size/baseline/
          done
          ls -l .firmware-size .firmware-size/baseline

      - name: Render the report
        run: |
          set -euo pipefail
          args=()
          for f in .firmware-size/esp32-s3.json .firmware-size/esp32-s3-32mb.json; do
            [ -f "$f" ] && args+=(--current "$f")
          done
          for f in .firmware-size/baseline/*.json; do
            [ -f "$f" ] && args+=(--baseline "$f")
          done
          python3 embedded/esp32/tools/firmware_size.py render "${args[@]}" \
            --baseline-label "${BASELINE_TAG:-latest release}" \
            --intro "Built from ${GITHUB_SHA::7} by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}); compared with the latest release **${BASELINE_TAG:-?}**." \
            --out .firmware-size/comment.md
          cat .firmware-size/comment.md

      - name: Create or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- frameos-esp32-firmware-size -->'
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@.firmware-size/comment.md > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@.firmware-size/comment.md > /dev/null
            echo "created comment"
          fi

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs:
      - docker_image
      - esp32_firmware_image
    if: ${{ always() }}
    steps:
      - name: Check parallel jobs
        run: |
          if [ "${{ needs.docker_image.result }}" != "success" ]; then
            echo "Docker image job finished with result: ${{ needs.docker_image.result }}"
            exit 1
          fi
          if [ "${{ needs.esp32_firmware_image.result }}" != "success" ]; then
            echo "ESP32 firmware image job finished with result: ${{ needs.esp32_firmware_image.result }}"
            exit 1
          fi
