name: Publish npm packages

# Builds and publishes frameos-wasm + frameos-editor at the versions already
# committed in their package.json files. Never bumps versions — run the
# "Release FrameOS" workflow for that. Versions that already exist on npm are
# skipped, so re-running after a failed release publishes only what's missing.
#
# Auth uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. Each package
# must have a trusted publisher configured on npmjs.com pointing at this
# repository and this workflow file (npm-publish.yml).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to build and publish from'
        required: false
        type: string
        default: main
      runtime_run_id:
        description: >-
          Run id of a "Release FrameOS" run whose build-wasm-runtime job
          built the wasm bundle: download that artifact instead of compiling
          the runtime here (the release job passes its own id). Leave empty to
          build from source.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write
  # `gh run download` of the release run's wasm artifact.
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish FrameOS npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11

      # nim-lang.org drops connections and serves 503s often enough to fail
      # real runs — one observed window outlasted curl's five retries AND a
      # spaced second attempt. Cache the installed toolchain: on a hit the
      # host is never contacted at all; the download (with its one retry
      # below) only runs when this key has never been populated.
      # The toolchain is only needed when this run compiles the runtime
      # itself (no runtime_run_id): a release hands over the bundle it built.
      - name: Cache Nim toolchain
        if: inputs.runtime_run_id == ''
        id: cache_nim_toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.choosenim
            ~/.nimble/bin
          key: ${{ runner.os }}-nim-toolchain-2.2.4

      - uses: jiro4989/setup-nim-action@v1
        if: inputs.runtime_run_id == '' && steps.cache_nim_toolchain.outputs.cache-hit != 'true'
        id: setup_nim
        continue-on-error: true
        with:
          nim-version: 2.2.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry Nim setup once
        if: inputs.runtime_run_id == '' && steps.cache_nim_toolchain.outputs.cache-hit != 'true' && steps.setup_nim.outcome == 'failure'
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: 2.2.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add cached Nim to PATH
        if: inputs.runtime_run_id == '' && steps.cache_nim_toolchain.outputs.cache-hit == 'true'
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - uses: mymindstorm/setup-emsdk@v14
        if: inputs.runtime_run_id == ''
        with:
          version: 6.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release dispatches this workflow with the run id whose
      # build-wasm-runtime job built the bundle, so the npm package ships
      # the exact frameos-<version>-wasm.tar.gz the release attached —
      # extracted to where build_wasm.sh would have written it, so the
      # package build below does not know the difference.
      # `runtime_run_id` is a free-form input, so before anything from that
      # run reaches npm two things are checked: the run is a "Release FrameOS"
      # run of this repository's main branch (not a fork's, not a PR's,
      # not some other workflow's artifact that happens to share the name),
      # and the tarball carries a signature by the release key (the
      # build-wasm-runtime job signs it; release-assets/firmware-signing.pub
      # is the committed public half). The run is usually still in progress
      # when it dispatches this workflow, so its conclusion is not required.
      - name: Download the release's wasm runtime
        if: inputs.runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          case "$RUNTIME_RUN_ID" in
            ''|*[!0-9]*) echo "::error::runtime_run_id must be a run id"; exit 1 ;;
          esac
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID")
          run_path=$(jq -r '.path' <<<"$run_json")
          run_branch=$(jq -r '.head_branch' <<<"$run_json")
          run_repo=$(jq -r '.head_repository.full_name' <<<"$run_json")
          run_event=$(jq -r '.event' <<<"$run_json")
          run_status=$(jq -r '.status + "/" + (.conclusion // "-")' <<<"$run_json")
          echo "run $RUNTIME_RUN_ID: $run_path on $run_repo@$run_branch ($run_event, $run_status)"
          if [ "$run_path" != ".github/workflows/docker-publish-multi.yml" ]; then
            echo "::error::run $RUNTIME_RUN_ID is not a Release FrameOS run ($run_path)"; exit 1
          fi
          if [ "$run_repo" != "$GITHUB_REPOSITORY" ] || [ "$run_branch" != "main" ]; then
            echo "::error::run $RUNTIME_RUN_ID did not run on $GITHUB_REPOSITORY@main ($run_repo@$run_branch)"; exit 1
          fi
          case "$run_status" in
            in_progress/*|completed/success) ;;
            *) echo "::error::run $RUNTIME_RUN_ID is $run_status"; exit 1 ;;
          esac
          version=$(python3 -c "import json; print(json.load(open('versions.json'))['docker'].split('+', 1)[0])")
          gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "frameos-${version}-wasm" --dir release-assets
          tarball="release-assets/frameos-${version}-wasm.tar.gz"
          [ -f "$tarball" ] || { echo "::error::$tarball missing from the artifact"; exit 1; }
          [ -f "$tarball.minisig" ] || { echo "::error::$tarball is unsigned"; exit 1; }
          python3 -m pip install --quiet --require-hashes --break-system-packages \
              -r tools/requirements-signing.txt \
            || python3 -m pip install --quiet --require-hashes -r tools/requirements-signing.txt
          python3 tools/sign_firmware.py verify --public release-assets/firmware-signing.pub "$tarball"
          mkdir -p frontend/public/frameos-wasm
          tar -xzf "$tarball" -C frontend/public/frameos-wasm
          ls -la frontend/public/frameos-wasm

      # The runtime assets (frameos.js/frameos.wasm) are build outputs, not
      # committed — compile them like the Dockerfile does.
      - name: Build the wasm runtime
        if: inputs.runtime_run_id == ''
        run: |
          cd frameos
          nimble install -d -y
          ./tools/build_wasm.sh

      - name: Build frameos-wasm
        run: pnpm --dir frameos/wasm run build

      # The embedded editor bundle needs the full frontend build (its build
      # config lives in frontend/build.mjs).
      - name: Build the frontend and frameos-editor
        run: |
          pnpm --dir frontend run build
          pnpm --dir frameos/editor run build

      - name: Publish frameos-wasm and frameos-editor
        run: |
          for package in frameos/wasm frameos/editor; do
            name=$(node -p "require('./${package}/package.json').name")
            version=$(node -p "require('./${package}/package.json').version")
            # Each package version follows its own content-owning component;
            # skip only when that exact component version already exists.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already on npm — skipping."
              continue
            fi
            (cd "$package" && npm publish --access public)
          done
