name: Run Tests

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
    paths-ignore:
      - buildroot-images.json
      - cross-toolchain-images.json

# Superseded runs on the same PR are cancelled; pushes to main always run to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which of the heavy jobs below this pull request needs, from the files it
  # changes (.github/ci/changed_areas.py has the rules and why each one is
  # safe). Pushes run everything. No check is required on this repository, so
  # a job skipped here is simply absent from the run; one that is not skipped
  # waits ~10 s for this.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ steps.areas.outputs.runtime }}
      renderer: ${{ steps.areas.outputs.renderer }}
      frontend_e2e: ${{ steps.areas.outputs.frontend_e2e }}
      deploy: ${{ steps.areas.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
      - name: Classify the changed files
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/ci/changed_areas.py

  nim:
    name: FrameOS Nim Tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    # Self-hosted 16-core slots (ephemeral Incus VMs on the monster host; see
    # tools/gha-runners/README.md), which start with the toolchains and
    # main's dependencies in the image. The shard runner compiles one test
    # file per core, so the shard is CPU: on the old 4-core slots the host sat
    # ~90% idle while a run waited on them (2026-11-14).
    # Pull requests from forks run on GitHub-hosted runners: the self-hosted
    # VMs share one /mnt/cache (read-only there apart from the nimcache and
    # ccache archives; tools/gha-runners/README.md), and code nobody has reviewed
    # should not seed it. Same-repo PRs and main keep the pool.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    # Four shards: a shard's fixed cost (checkout, assets, the nimcache
    # unpack) is paid once per shard, and four 16-core shards finish the
    # suite in about a minute of tests. tools/run_test_shard.sh defaults to
    # the same count.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the runner
      # pool's address (the git-upload-pack POST answers 401 while the
      # advertisement is fine): nimble's fetch-by-commit died on it across a
      # whole push. HTTP/1.1 from the same host succeeds every time.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      # head.sha, never head.ref: the ref is a branch name in the fork, and a
      # branch can be moved between the event and the checkout. The sha is
      # the commit the run was started for.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      # The runner image ships python3 (+ `python`), which is all the nim
      # setup scripts need. Node is only needed when the compiled-assets cache
      # misses and prepare_assets.py has to rebuild the frame frontend, so its
      # ~35 s of setup (mostly the pnpm store restore) is skipped on a hit.
      # The key must hash every input prepare_assets.py fingerprints
      # (FRONTEND_SOURCE_FILES + REPO_ROOT_FILES there). With one missing, a
      # change to it is a cache HIT — so no Node — followed by
      # prepare_assets.py deciding to rebuild anyway: "pnpm or corepack is
      # required", every shard red (frontend/scripts/generateRepoApps.mjs and
      # frontend/package.json, 2026-09-20).
      - name: Cache compiled assets
        id: cache_assets
        uses: actions/cache@v4
        with:
          path: |
            frameos/assets/compiled
            frameos/src/assets
          key: ${{ runner.os }}-frameos-assets-${{ hashFiles('frameos/frontend/**', 'frameos/tools/prepare_assets.py', 'frameos/tools/generate_*.py', 'frontend/src/**', 'frontend/schema/**', 'frontend/public/**', 'frontend/scripts/generateRepoApps.mjs', 'frontend/package.json', 'repo/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'versions.json') }}

      - name: Set up Node and pnpm
        if: steps.cache_assets.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: frameos/quickjs
          key: ${{ runner.os }}-quickjs-${{ hashFiles('frameos/frameos.nimble', 'frameos/tools/install_prebuilt_quickjs.py', 'versions.json') }}

      - name: FrameOS nim setup
        run: |
          cd frameos
          nimble install -d
          nimble assets
          nimble build_quickjs --silent
          nimble setup
          FRAMEOS_ROOT_DIR="." python3 tools/makeapploaders.py
          # The Remote (remote/) is its own nimble package with deps the
          # runtime does not have (nimcrypto, ws); its nimble.paths lets the
          # shard runner compile remote/tests like everything under src/.
          (cd remote && nimble install -d && nimble setup)

      # Every test file is a full compile of most of the tree, and Nim only
      # re-runs gcc for C files whose generated text changed — so a warm
      # nimcache roughly halves a test's compile (10 s -> 4 s measured).
      # Testament keys each test's cache dir by file path + options (stable
      # across commits), and the shard assignment is a stable hash of the path
      # too, so one cache per shard on the host-side /mnt/cache mount (shared
      # into every runner VM, no GitHub cache quota) stays warm across runs.
      #
      # Nim trusts an object whose .c is unchanged and older, without checking
      # that the .o came from that .c. One shared directory that overlapping
      # runs copied into and out of paired one build's .c with another's .o
      # (shard 1 linked a stale object on three runs in a row, 2026-10-18), so
      # tools/ci_nimcache.sh keeps the cache as one archive per shard, which a
      # save replaces in one rename and a restore unpacks whole. Both stay best
      # effort: a warm-cache miss is never worth a red job.
      - name: Restore nimcache
        id: restore_nimcache
        run: bash frameos/tools/ci_nimcache.sh restore ${{ matrix.shard }}

      # The shard runner compiles+runs one test file per core (FRAMEOS_TEST_JOBS,
      # defaults to nproc on CI): each testament call is a single-threaded Nim
      # compile, so sequential runs idled three of the four cores.
      - name: FrameOS nim tests
        run: |
          cd frameos
          bash ./tools/run_test_shard.sh ${{ matrix.shard }}

      # Pushes to main only (and a pull request when there is no archive at
      # all yet): the archive then always holds main's objects, which is what
      # every pull request restores and recompiles its own changes against,
      # and a pull request does not spend 40 s writing a cache it would only
      # hand to the next unrelated branch. Not after a cancel: a gcc killed
      # mid-write leaves a truncated .o newer than its .c, which the next run
      # would link.
      - name: Save nimcache
        if: ${{ !cancelled() && (github.event_name == 'push' || steps.restore_nimcache.outputs.missing == 'true') }}
        run: bash frameos/tools/ci_nimcache.sh save ${{ matrix.shard }}

      # Plain `node --test` suites next to FrameOS code that no JS workspace
      # job runs: the wasm preview's HTTP host library (its request guard)
      # and the frameos-editor embed helper (its origin filter).
      - name: Set up Node for FrameOS JS unit tests
        if: ${{ matrix.shard == 1 }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: FrameOS JS unit tests
        if: ${{ matrix.shard == 1 }}
        run: node --test frameos/tools/wasm/frameos_library.test.mjs frameos/editor/embed.test.mjs

      - name: FrameOS ESP32 Nim compile
        if: ${{ matrix.shard == 1 }}
        run: |
          cd frameos
          nim c \
            --compileOnly \
            --os:freertos \
            --cpu:esp \
            --mm:orc \
            --threads:off \
            --exceptions:goto \
            --noMain \
            --opt:size \
            -d:release \
            -d:useMalloc \
            -d:noSignalHandler \
            -d:frameosEmbedded \
            --nimcache:/tmp/frameos-esp32-nimcache \
            src/embedded/embedded_main.nim

  # pixie's own suite (frameos/pixie, the fork in the tree since 2026-11-07):
  # its image comparisons are what says a changed fill or stroke still draws
  # the same pixels. A job of its own, one compile per core: it was 4.5
  # minutes on the end of Nim shard 2, the run's longest job.
  pixie:
    name: pixie tests
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    steps:
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: pixie tests
        run: |
          cd frameos
          nimble install -d
          make test-pixie PIXIE_TEST_JOBS="$(nproc)"

  esp32-kitchen-sink:
    # The biggest thing a UI does on an ESP32, in the memory one has: the wasm
    # build of this commit's runtime, its heap capped to an 8 MB SenseCAP
    # Indicator's, played through as a person would (a layout, its pages, forty
    # brush strokes). Emscripten is too slow for the Nim shards.
    name: Kitchen sink in an ESP32's memory
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: 2.2.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the wasm runtime
        run: |
          set -euo pipefail
          (cd frameos && nimble install -d -y && ./tools/build_wasm.sh --out "$RUNNER_TEMP/frameos-wasm")

      - name: Play the Kitchen sink in 8 MB
        run: node frameos/tools/esp32_kitchen_sink.mjs "$RUNNER_TEMP/frameos-wasm"

      # The 8-bit palette samples: every Pixel toys effect (Hellfire among them)
      # and every Color cycling scene, and swipes: no out-of-memory, error or discarded
      # interpreter, nothing that stops moving, grows or slows down as it runs.
      - name: Play the 8-bit palette samples in 8 MB
        run: node frameos/tools/esp32_palette_scenes.mjs "$RUNNER_TEMP/frameos-wasm"

  visual-regression:
    name: Visual Regression Tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    # Pixie renders these snapshots in software from fonts in the repo — no
    # browser, no system fonts — so the host image does not shape the pixels
    # and the job can use the self-hosted pool like the Nim shards.
    # Pull requests from forks run on GitHub-hosted runners: the self-hosted
    # VMs share one /mnt/cache (read-only there apart from the nimcache and
    # ccache archives; tools/gha-runners/README.md), and code nobody has reviewed
    # should not seed it. Same-repo PRs and main keep the pool.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the runner
      # pool's address (the git-upload-pack POST answers 401 while the
      # advertisement is fine): nimble's fetch-by-commit died on it across a
      # whole push. HTTP/1.1 from the same host succeeds every time.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up the backend's Python
        uses: ./.github/actions/setup-backend-python

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: frameos/quickjs
          key: ${{ runner.os }}-quickjs-${{ hashFiles('frameos/frameos.nimble', 'frameos/tools/install_prebuilt_quickjs.py', 'versions.json') }}

      # Same key as the Nim shards' (the inputs prepare_assets.py fingerprints):
      # on a hit `nimble assets` finds the frame's compiled assets current.
      - name: Cache compiled assets
        uses: actions/cache@v4
        with:
          path: |
            frameos/assets/compiled
            frameos/src/assets
          key: ${{ runner.os }}-frameos-assets-${{ hashFiles('frameos/frontend/**', 'frameos/tools/prepare_assets.py', 'frameos/tools/generate_*.py', 'frontend/src/**', 'frontend/schema/**', 'frontend/public/**', 'frontend/scripts/generateRepoApps.mjs', 'frontend/package.json', 'repo/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'versions.json') }}

      # No `nimble build` here: e2e/Makefile builds its own binary from a copy
      # of frameos/ with this shard's scenes compiled in, and that build is
      # the one it runs (the one that used to be here was a minute of compile
      # nobody ran). What it did that the copy needs is `nimble assets`, its
      # `before build` hook: the copy has no frontend to build them from.
      - name: FrameOS nim setup
        run: |
          cd frameos
          nimble install -d
          nimble assets
          nimble setup
          FRAMEOS_ROOT_DIR="." python3 ../e2e/makeapploaders.py

      # The binary's nimcache, kept like the Nim test shards' (one archive per
      # shard, frameos/tools/ci_nimcache.sh) outside e2e/tmp, which the
      # Makefile deletes before it copies the tree in.
      - name: Restore the renderer's nimcache
        id: restore_nimcache
        env:
          FRAMEOS_NIMCACHE_ROOT: /mnt/cache/nimcache/e2e-renderer-archives
          FRAMEOS_NIMCACHE_DIR: ${{ github.workspace }}/.tmp/e2e-nimcache
        run: bash frameos/tools/ci_nimcache.sh restore ${{ matrix.shard }}

      - name: Visual regression tests
        env:
          E2E_NIMCACHE: ${{ github.workspace }}/.tmp/e2e-nimcache
        run: |
          cd e2e
          source ../backend/.venv/bin/activate
          FRAMEOS_E2E_SHARD=${{ matrix.shard }} FRAMEOS_E2E_SHARDS=2 make
          git status --short snapshots
          git diff --name-only -- snapshots

      - name: Save the renderer's nimcache
        if: ${{ !cancelled() && (github.event_name == 'push' || steps.restore_nimcache.outputs.missing == 'true') }}
        env:
          FRAMEOS_NIMCACHE_ROOT: /mnt/cache/nimcache/e2e-renderer-archives
          FRAMEOS_NIMCACHE_DIR: ${{ github.workspace }}/.tmp/e2e-nimcache
        run: bash frameos/tools/ci_nimcache.sh save ${{ matrix.shard }}

      - name: Collect visual snapshot changes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          mkdir -p .tmp/visual-regression-snapshot-artifact/.snapshot-manifest
          printf 'visual regression snapshot shard %s/2\n' '${{ matrix.shard }}' > ".tmp/visual-regression-snapshot-artifact/SHARD-${{ matrix.shard }}.txt"
          git diff --name-only -- e2e/snapshots > .tmp/visual-regression-snapshot-files.txt
          git ls-files --others --exclude-standard -- e2e/snapshots >> .tmp/visual-regression-snapshot-files.txt
          sort -u .tmp/visual-regression-snapshot-files.txt -o .tmp/visual-regression-snapshot-files.txt
          git diff --name-only --diff-filter=D -- e2e/snapshots > ".tmp/visual-regression-snapshot-artifact/.snapshot-manifest/deleted-${{ matrix.shard }}.txt"
          while IFS= read -r file; do
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              continue
            fi
            mkdir -p ".tmp/visual-regression-snapshot-artifact/$(dirname "$file")"
            cp "$file" ".tmp/visual-regression-snapshot-artifact/$file"
          done < .tmp/visual-regression-snapshot-files.txt

      - name: Upload visual snapshot changes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshot-changes-${{ matrix.shard }}
          path: .tmp/visual-regression-snapshot-artifact
          if-no-files-found: error

  visual-regression-snapshot-commit:
    name: Commit Visual Regression Snapshots
    runs-on: ubuntu-latest
    needs: visual-regression
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      # The checkout pins head.sha, which leaves HEAD detached, and the
      # commit step's `pull --rebase` needs a branch with an upstream. This
      # job only runs for same-repo pull requests (see `if`), so head.ref is
      # a branch of this repository; it is still only ever read into an
      # environment variable, never interpolated into the script.
      - name: Return to the pull request branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # No depth limit: the branch may already carry a commit from the
          # other snapshot job, and the rebase must see head.sha as its
          # ancestor rather than try to apply it again.
          git fetch --no-tags origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git checkout -B "$HEAD_REF"
          git branch --set-upstream-to "origin/$HEAD_REF"

      - name: Download visual snapshot changes
        uses: actions/download-artifact@v4
        with:
          pattern: visual-regression-snapshot-changes-*
          path: .tmp/visual-regression-snapshot-artifacts
          merge-multiple: true

      - name: Restore visual snapshot changes
        run: |
          if [ -d .tmp/visual-regression-snapshot-artifacts/.snapshot-manifest ]; then
            find .tmp/visual-regression-snapshot-artifacts/.snapshot-manifest -name 'deleted-*.txt' -print0 | while IFS= read -r -d '' manifest; do
              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  rm -f "$file"
                fi
              done < "$manifest"
            done
          fi
          if [ -d .tmp/visual-regression-snapshot-artifacts/e2e/snapshots ]; then
            cp -a .tmp/visual-regression-snapshot-artifacts/e2e/snapshots/. e2e/snapshots/
          fi
          git status --short e2e/snapshots

      - name: Commit visual regression snapshots
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4 — SHA-pinned: a tag can be moved, and this job holds a write token
        with:
            add: 'e2e/snapshots/**'
            author_name: FrameOS Bot
            author_email: git@frameos.net
            message: 'Update snapshots'
            pull: --rebase --autostash
            default_author: github_actions

  frontend-visual-regression:
    name: Frontend E2E + Visual Regression Tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.frontend_e2e == 'true'
    # Chromium screenshots depend on the fonts and libraries of the machine
    # that rendered them, which used to pin this job to GitHub's ubuntu-latest
    # image. The official Playwright container (tag = the @playwright/test
    # version in pnpm-lock.yaml; bump both together) fixes that environment
    # wherever it runs, so the job can move to the self-hosted pool. Browsers
    # ship in the image, hence no `playwright install` step.
    # Pull requests from forks run on GitHub-hosted runners: the self-hosted
    # VMs share one /mnt/cache (read-only there apart from the nimcache and
    # ccache archives; tools/gha-runners/README.md), and code nobody has reviewed
    # should not seed it. Same-repo PRs and main keep the pool.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    # The image is pulled into the runner VM image ahead of time
    # (tools/gha-runners/bin/gha-image-warm.sh reads this line), so starting
    # it is seconds, not the minute a 2 GB pull took.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    permissions:
      contents: read
    # Four shards of four workers, each worker against a backend of its own
    # (e2e/frontend-visual/tests/backends.ts): with one worker a shard's 70
    # tests ran one after another for 5 minutes. The shard count also lives
    # in the two --shard arguments, the artifact names and e2e/README.md.
    env:
      FRONTEND_VISUAL_WORKERS: '4'
      FRONTEND_VISUAL_BACKENDS: '4'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the runner
      # pool's address (the git-upload-pack POST answers 401 while the
      # advertisement is fine): nimble's fetch-by-commit died on it across a
      # whole push. HTTP/1.1 from the same host succeeds every time.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      # Steps run as root inside the container: no sudo. git is for the
      # snapshot diff steps below; checkout itself falls back to the REST API
      # without it, but `git diff` does not — and it refuses a workspace owned
      # by another uid (the runner's) unless it is marked safe.
      # fonts-inter: every font stack in the repo asks for Inter first, and
      # without it the image resolves Inter / system-ui / sans-serif to
      # WenQuanYi Zen Hei, a CJK face with no bold — the cloud stack (no
      # Helvetica/Arial to alias onto Liberation Sans) then renders every
      # weight as regular.
      - name: Install redis and fonts
        run: |
          apt-get -y update
          apt-get install -y --no-install-recommends redis-server git fonts-inter
          fc-cache -f >/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          redis-server --daemonize yes

      - name: Set up the backend's Python
        uses: ./.github/actions/setup-backend-python

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The three bundles the shard serves, side by side (each is one esbuild
      # process; one after another they were 50 s): the frontend the backend
      # serves (its generated app modules first, then esbuild; not `run
      # build`, whose JSON schema regeneration and `tsc` the typescript job
      # runs), the on-frame admin (frame-admin.spec.ts serves it through
      # route interception) and the cloud frontend (visual-cloud-*.spec.ts,
      # tests/cloud-workspace-fixture.ts); without either of the last two
      # those tests skip silently. All three regenerate the repo app modules,
      # which are written atomically with the same content.
      - name: Build the frontends
        run: |
          pnpm --dir frontend run build:repo-apps
          pnpm --dir frontend run build:esbuild &
          frontend=$!
          pnpm --dir frameos/frontend run build &
          admin=$!
          pnpm --dir cloud-frontend run build &
          cloud=$!
          wait "$frontend"
          wait "$admin"
          wait "$cloud"

      - name: Run frontend visual regression tests
        shell: bash
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
        env:
          DEBUG: '1'
          SECRET_KEY: frontend-visual-ci-secret
        run: |
          source backend/.venv/bin/activate
          pnpm exec playwright test -c e2e/frontend-visual/playwright.config.ts --shard=${{ matrix.shard }}/4

      - name: Update frontend visual snapshots
        shell: bash
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          DEBUG: '1'
          SECRET_KEY: frontend-visual-ci-secret
        run: |
          source backend/.venv/bin/activate
          pnpm exec playwright test -c e2e/frontend-visual/playwright.config.ts --update-snapshots --shard=${{ matrix.shard }}/4
          git status --short e2e/frontend-visual/snapshots

      - name: Collect frontend visual snapshot changes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          mkdir -p .tmp/frontend-visual-snapshot-artifact
          printf 'frontend visual snapshot shard %s/4\n' '${{ matrix.shard }}' > ".tmp/frontend-visual-snapshot-artifact/SHARD-${{ matrix.shard }}.txt"
          git diff --name-only -- e2e/frontend-visual/snapshots > .tmp/frontend-visual-snapshot-files.txt
          git ls-files --others --exclude-standard -- e2e/frontend-visual/snapshots >> .tmp/frontend-visual-snapshot-files.txt
          sort -u .tmp/frontend-visual-snapshot-files.txt -o .tmp/frontend-visual-snapshot-files.txt
          while IFS= read -r file; do
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              continue
            fi
            mkdir -p ".tmp/frontend-visual-snapshot-artifact/$(dirname "$file")"
            cp "$file" ".tmp/frontend-visual-snapshot-artifact/$file"
          done < .tmp/frontend-visual-snapshot-files.txt

      - name: Upload frontend visual snapshot changes
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-snapshot-changes-${{ matrix.shard }}
          path: .tmp/frontend-visual-snapshot-artifact
          if-no-files-found: error

      - name: Upload frontend visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-report-${{ matrix.shard }}-of-4
          path: |
            e2e/frontend-visual/playwright-report
            e2e/frontend-visual/test-results
          if-no-files-found: ignore

  frontend-visual-snapshot-commit:
    name: Commit Frontend Visual Snapshots
    runs-on: ubuntu-latest
    needs: frontend-visual-regression
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      # The checkout pins head.sha, which leaves HEAD detached, and the
      # commit step's `pull --rebase` needs a branch with an upstream. This
      # job only runs for same-repo pull requests (see `if`), so head.ref is
      # a branch of this repository; it is still only ever read into an
      # environment variable, never interpolated into the script.
      - name: Return to the pull request branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # No depth limit: the branch may already carry a commit from the
          # other snapshot job, and the rebase must see head.sha as its
          # ancestor rather than try to apply it again.
          git fetch --no-tags origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git checkout -B "$HEAD_REF"
          git branch --set-upstream-to "origin/$HEAD_REF"

      - name: Download frontend visual snapshot changes
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-visual-snapshot-changes-*
          path: .tmp/frontend-visual-snapshot-artifacts
          merge-multiple: true

      - name: Restore frontend visual snapshot changes
        run: |
          if [ -d .tmp/frontend-visual-snapshot-artifacts/e2e/frontend-visual/snapshots ]; then
            cp -a .tmp/frontend-visual-snapshot-artifacts/e2e/frontend-visual/snapshots/. e2e/frontend-visual/snapshots/
          fi
          git status --short e2e/frontend-visual/snapshots

      - name: Commit frontend visual snapshots
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4 — SHA-pinned: a tag can be moved, and this job holds a write token
        with:
            add: 'e2e/frontend-visual/snapshots/**'
            author_name: FrameOS Bot
            author_email: git@frameos.net
            message: 'Update frontend visual snapshots'
            pull: --rebase --autostash
            default_author: github_actions

  python:
    name: Backend tests
    # The suite runs under pytest-xdist, one worker per core, each with its
    # own sqlite file and Redis database (backend/app/conftest.py): 16 cores
    # take it from five and a half minutes in one process to under one.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    steps:
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One database per xdist worker on one server: 64 of them, not
      # Redis's default 16. From the image (pre-pulled on the pool), not apt.
      - name: Start redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --databases 64 --save '' --appendonly no

      # The editor's JavaScript validation (tools/js_check.nim, built by the
      # backend on first use) links the bundled QuickJS, so the prebuilt
      # library has to be here. Same cache key as the Nim jobs.
      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: frameos/quickjs
          key: ${{ runner.os }}-quickjs-${{ hashFiles('frameos/frameos.nimble', 'frameos/tools/install_prebuilt_quickjs.py', 'versions.json') }}

      - name: FrameOS QuickJS
        run: |
          cd frameos
          nimble build_quickjs --silent

      - name: Set up the backend's Python
        uses: ./.github/actions/setup-backend-python

      # The suite builds its tables from the models; this runs the alembic
      # chain end to end against a throwaway database.
      - name: Migrations upgrade head
        env:
          DATABASE_URL: sqlite:///migrations/migrate-check.db
        run: |
          cd backend
          source .venv/bin/activate
          rm -f migrations/migrate-check.db
          TEST=1 PYTHONPATH=. alembic upgrade head
          TEST=1 PYTHONPATH=. alembic downgrade -1
          TEST=1 PYTHONPATH=. alembic upgrade head

      # No DATABASE_URL: TestConfig's sqlite default is what every install runs.
      - name: Run Pytest
        run: |
          cd backend
          source .venv/bin/activate
          # fake these folders so static asset serving doesn't fail
          mkdir -p ../frontend/dist/assets
          mkdir -p ../frontend/dist/img
          mkdir -p ../frontend/dist/static
          TEST=1 pytest -n auto

  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The full requirement set, not just ruff+mypy: mypy's verdicts depend
      # on which third-party packages it can see, and backend/mypy-baseline.txt
      # was recorded against all of them.
      - name: Set up the backend's Python
        uses: ./.github/actions/setup-backend-python

      # backend/ruff.toml is the rule set; every violation fails.
      - name: Ruff
        run: |
          cd backend
          source .venv/bin/activate
          ruff check --output-format github .

      # Ratchet: mypy errors are compared with backend/mypy-baseline.txt —
      # new ones fail, fixed ones ask for `python tools/mypy_gate.py --update`.
      - name: Mypy (no new errors)
        run: |
          cd backend
          source .venv/bin/activate
          python tools/mypy_gate.py

  # The workflows are code that only ever runs on CI, so nothing else checks
  # them: actionlint catches an unknown `runs-on` label (a job that queues
  # forever — .github/actionlint.yaml declares the self-hosted pool's), a
  # misspelt context or `needs`, and runs shellcheck over every `run:` block.
  # The binary is pinned by sha256 like every other tool CI downloads.
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # shellcheck ships with the GitHub-hosted image; actionlint picks it up
      # from PATH. -color keeps the annotated source lines readable in the log.
      - name: Run actionlint
        run: |
          set -euo pipefail
          shellcheck --version
          actionlint -color

  frameos-setup-script:
    name: Standalone setup script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker version

      - name: Check shell syntax
        run: sh -n scripts/frameos-setup.sh

      # Pure-Python pins: the script's fallback release equals versions.json's
      # `docker` entry, and the release CalVer arithmetic never goes backwards.
      - name: Release pin and CalVer tests
        run: python3 -m unittest scripts.tests.test_setup_script_defaults tools.tests.test_update_versions -v

      - name: Run setup script container tests
        run: python3 -m unittest scripts.tests.test_frameos_setup -v

  # The deploy E2E tests, in two jobs that run side by side: the SSH deploy
  # (three deploys of a frame into a disposable SSH container, each compiling
  # FrameOS its own way) and the rest (the runtime's render log and a real
  # Buildroot SD image, which need a native build of this commit). One job
  # ran all of it in a row and was the run's long pole.
  # Pull requests from forks run on GitHub-hosted runners: the self-hosted
  # VMs share one /mnt/cache (read-only there apart from the Nim shards'
  # nimcache; tools/gha-runners/README.md), and code nobody has reviewed
  # should not seed it. Same-repo PRs and main keep the pool.
  deploy-e2e:
    name: Deploy E2E SSH
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the runner
      # pool's address (the git-upload-pack POST answers 401 while the
      # advertisement is fine): nimble's fetch-by-commit died on it across a
      # whole push. HTTP/1.1 from the same host succeeds every time.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the backend's Python
        uses: ./.github/actions/setup-backend-python

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: frameos/quickjs
          key: ${{ runner.os }}-quickjs-${{ hashFiles('frameos/frameos.nimble', 'frameos/tools/install_prebuilt_quickjs.py', 'versions.json') }}

      # Same key as the Nim shards' (the inputs prepare_assets.py fingerprints):
      # on a hit `nimble assets` finds the frame's compiled assets current.
      - name: Cache compiled assets
        uses: actions/cache@v4
        with:
          path: |
            frameos/assets/compiled
            frameos/src/assets
          key: ${{ runner.os }}-frameos-assets-${{ hashFiles('frameos/frontend/**', 'frameos/tools/prepare_assets.py', 'frameos/tools/generate_*.py', 'frontend/src/**', 'frontend/schema/**', 'frontend/public/**', 'frontend/scripts/generateRepoApps.mjs', 'frontend/package.json', 'repo/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'versions.json') }}

      - name: Verify Docker
        run: docker version

      # The SSH deploy compiles inside its own containers; it needs the
      # checkout's assets, QuickJS and app loaders, not a build of its own.
      - name: Prepare FrameOS build inputs
        run: |
          cd frameos
          nimble install -d
          nimble assets
          nimble build_quickjs --silent
          nimble setup
          FRAMEOS_ROOT_DIR="." python3 ../e2e/makeapploaders.py

      # The test builds a Debian image with a toolchain in it (~54 s). Its tag
      # is a hash of the build context, so an image by that name can only have
      # come from exactly these files: the test finds it in the daemon and
      # skips the build, and an edit to the context changes the tag so both
      # this and the test rebuild. The pool's VM image carries main's (built by
      # gha-image-warm.sh), so there the cache below is only read when this
      # branch changed the context.
      #
      # The whole image is cached as one tarball rather than as buildx layers.
      # With a layer cache every run still paid buildx's export-then-import
      # round trip into the daemon (~68 s for a 175 MB image, more than the
      # build it was saving); `docker load` of a cached tar is ~10 s.
      - name: Compute SSH target image tag
        id: ssh_target_tag
        run: |
          tag="$(python3 backend/app/tasks/tests/deploy_ssh_target/context_tag.py)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker image inspect "$tag" > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SSH target image
        id: cache_ssh_target
        if: steps.ssh_target_tag.outputs.present != 'true'
        uses: actions/cache@v4
        with:
          path: .tmp/ssh-target-image.tar
          key: ${{ runner.os }}-ssh-target-image-${{ steps.ssh_target_tag.outputs.tag }}

      - name: Load cached SSH target image
        if: steps.ssh_target_tag.outputs.present != 'true' && steps.cache_ssh_target.outputs.cache-hit == 'true'
        run: docker load -i .tmp/ssh-target-image.tar

      - name: Build SSH target image
        if: steps.ssh_target_tag.outputs.present != 'true' && steps.cache_ssh_target.outputs.cache-hit != 'true'
        run: |
          TAG="${{ steps.ssh_target_tag.outputs.tag }}"
          echo "SSH target image: $TAG"
          docker build -t "$TAG" backend/app/tasks/tests/deploy_ssh_target
          mkdir -p .tmp
          docker save -o .tmp/ssh-target-image.tar "$TAG"

      - name: Verify SSH target image is present under the tag the test computes
        run: |
          TAG="${{ steps.ssh_target_tag.outputs.tag }}"
          docker image inspect "$TAG" > /dev/null
          echo "SSH target image present: $TAG"

      - name: Run SSH deploy E2E test
        run: |
          cd backend
          source .venv/bin/activate
          mkdir -p ../frontend/dist/assets
          mkdir -p ../frontend/dist/img
          mkdir -p ../frontend/dist/static
          # The two tests (compile on the device; cross compile + precompiled)
          # side by side, each against its own target container: their two
          # ~90 s compiles ran one after another. -rA prints each test's
          # phase log, which xdist would otherwise keep to failures.
          TEST=1 FRAMEOS_E2E_DEPLOY=1 pytest -n 2 -rA app/tasks/tests/test_real_ssh_deploy_e2e.py -q

  runtime-e2e:
    name: Runtime + Buildroot E2E
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'epyc-16' }}
    # Redis for the runtime E2E test. A service container comes up during job
    # setup instead of costing an `apt-get update && apt-get install` step
    # (~30 s) inside it; the tests reach it through REDIS_URL, and the runtime
    # test's skip guard probes that port rather than looking for a binary.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the runner
      # pool's address (the git-upload-pack POST answers 401 while the
      # advertisement is fine): nimble's fetch-by-commit died on it across a
      # whole push. HTTP/1.1 from the same host succeeds every time.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the backend's Python
        uses: ./.github/actions/setup-backend-python

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Nim
        uses: ./.github/actions/setup-nim
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache QuickJS
        uses: actions/cache@v4
        with:
          path: frameos/quickjs
          key: ${{ runner.os }}-quickjs-${{ hashFiles('frameos/frameos.nimble', 'frameos/tools/install_prebuilt_quickjs.py', 'versions.json') }}

      # Same key as the Nim shards' (the inputs prepare_assets.py fingerprints):
      # on a hit `nimble assets` finds the frame's compiled assets current.
      - name: Cache compiled assets
        uses: actions/cache@v4
        with:
          path: |
            frameos/assets/compiled
            frameos/src/assets
          key: ${{ runner.os }}-frameos-assets-${{ hashFiles('frameos/frontend/**', 'frameos/tools/prepare_assets.py', 'frameos/tools/generate_*.py', 'frontend/src/**', 'frontend/schema/**', 'frontend/public/**', 'frontend/scripts/generateRepoApps.mjs', 'frontend/package.json', 'repo/**', 'package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'versions.json') }}

      # The pool's VM image registers qemu-user-static's binfmt handlers at
      # boot (tools/gha-runners/bin/gha-image-build.sh); GitHub's do not.
      - uses: docker/setup-qemu-action@v3
        if: runner.environment == 'github-hosted'

      - name: Verify Docker
        run: docker version

      # The binary's nimcache, one archive like the Nim shards' (written by
      # pushes to main only): a warm one leaves only what this commit changed
      # to compile.
      - name: Restore the runtime's nimcache
        id: restore_nimcache
        env:
          FRAMEOS_NIMCACHE_ROOT: /mnt/cache/nimcache/runtime-e2e-archives
          FRAMEOS_NIMCACHE_DIR: ${{ github.workspace }}/.tmp/runtime-nimcache
        run: bash frameos/tools/ci_nimcache.sh restore 1

      - name: Build FrameOS
        run: |
          cd frameos
          nimble install -d
          nimble assets
          nimble build_quickjs --silent
          nimble setup
          FRAMEOS_ROOT_DIR="." python3 ../e2e/makeapploaders.py
          nimble build --nimcache:"$GITHUB_WORKSPACE/.tmp/runtime-nimcache"

      - name: Save the runtime's nimcache
        if: ${{ !cancelled() && (github.event_name == 'push' || steps.restore_nimcache.outputs.missing == 'true') }}
        env:
          FRAMEOS_NIMCACHE_ROOT: /mnt/cache/nimcache/runtime-e2e-archives
          FRAMEOS_NIMCACHE_DIR: ${{ github.workspace }}/.tmp/runtime-nimcache
        run: bash frameos/tools/ci_nimcache.sh save 1

      - name: Run runtime render log E2E test
        run: |
          cd backend
          source .venv/bin/activate
          mkdir -p ../frontend/dist/assets
          mkdir -p ../frontend/dist/img
          mkdir -p ../frontend/dist/static
          TEST=1 FRAMEOS_E2E_RUNTIME=1 FRAMEOS_RUNTIME_BIN="${{ github.workspace }}/frameos/build/frameos" pytest app/tasks/tests/test_real_frameos_runtime_e2e.py -q -s

      - name: Cache Buildroot E2E inputs
        uses: actions/cache@v4
        with:
          path: |
            .tmp/buildroot-base-cache
            .tmp/precompiled-cache
            .tmp/cross-cache
            build/prebuilt-deps
          key: ${{ runner.os }}-buildroot-e2e-${{ hashFiles('tools/buildroot-images/manifest.json', 'buildroot-images.json', 'versions.json', 'frameos/frameos.nimble') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-e2e-

      - name: Run Buildroot SD image E2E test
        timeout-minutes: 90
        env:
          FRAMEOS_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/buildroot-artifacts
          FRAMEOS_BUILDROOT_BASE_CACHE_DIR: ${{ github.workspace }}/.tmp/buildroot-base-cache
          FRAMEOS_BUILDROOT_CACHE_DIR: ${{ github.workspace }}/.tmp/buildroot-cache
          FRAMEOS_BUILDROOT_BASE_TIMEOUT: '300'
          FRAMEOS_PRECOMPILED_CACHE_DIR: ${{ github.workspace }}/.tmp/precompiled-cache
          FRAMEOS_CROSS_CACHE: ${{ github.workspace }}/.tmp/cross-cache
          FRAMEOS_CROSS_MAKE_JOBS: '2'
          FRAMEOS_E2E_BUILDROOT: '1'
        run: |
          cd backend
          source .venv/bin/activate
          TEST=1 pytest app/tasks/tests/test_real_buildroot_sd_image_e2e.py -q -s

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # builtinApps.ts embeds each app's app_loader.nim, and those are
      # generated and gitignored — without this step a clean checkout has none
      # of them and the regenerated catalog can never match the committed one.
      - name: Generate app loaders
        run: |
          cd frameos
          FRAMEOS_ROOT_DIR="." python3 tools/makeapploaders.py

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend run build

      # The build regenerates the committed app catalog and the config schema.
      # PR #476 changed five Nim apps without rerunning it, and the stale
      # sources shipped in the bundle for a day; fail instead.
      - name: Generated frontend files are in sync
        run: |
          if ! git diff --exit-code -- frontend/src/generated frontend/schema; then
            echo "::error::Committed generated files are stale. Run 'pnpm --dir frontend run build' and commit the result (app loaders first: cd frameos && FRAMEOS_ROOT_DIR=. python3 tools/makeapploaders.py)."
            exit 1
          fi

  pico-firmware:
    name: Pico W / Pico 2 W firmware
    # Pinned: pico-sdk 2.1.1's host pioasm misses <cstdint> and fails under
    # ubuntu-26.04's GCC 15. Moving on means pico-sdk >= 2.2.0 here AND in the
    # release job (docker-publish-multi.yml), plus a bench run of the UF2s.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The portable half of the firmware (parsers, the log ring, the hotspot's
      # DHCP/DNS, the flash state log, the status screen…) runs on the host
      # under ASan + UBSan: no SDK, no board.
      - name: Pico firmware host tests
        run: make -C embedded/pico/tests

      - name: Install pico toolchain
        uses: ./.github/actions/pico-toolchain

      - name: Cache pico-sdk
        id: pico-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2.1.1

      - name: Fetch pico-sdk
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk
          git submodule update --init --depth 1 lib/cyw43-driver lib/lwip lib/mbedtls lib/tinyusb

      - name: Build Pico W firmware
        run: |
          cd embedded/pico
          cmake -B build-pico-w -DPICO_BOARD=pico_w -DPICO_SDK_PATH="$HOME/pico-sdk" -G Ninja
          cmake --build build-pico-w
          test -f build-pico-w/frameos_pico.uf2

      - name: Build Pico 2 W firmware
        run: |
          cd embedded/pico
          cmake -B build-pico2-w -DPICO_BOARD=pico2_w -DPICO_SDK_PATH="$HOME/pico-sdk" -G Ninja
          cmake --build build-pico2-w
          test -f build-pico2-w/frameos_pico.uf2
