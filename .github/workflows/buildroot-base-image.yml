name: Publish Buildroot base image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Buildroot platform to publish; 'all' builds every platform in parallel"
        required: true
        default: raspberry-pi-64
        type: choice
        options:
          - all
          - raspberry-pi-32
          - raspberry-pi-64
          - raspberry-pi-5
      runner_label:
        description: "Runner label override; empty uses the platform default (32-core Depot runners — x86_64 for 32-bit ARM targets so prebuilt Bootlin toolchains apply)"
        required: false
        default: ""
        type: string
      next_version:
        description: "Version to stamp the image with; empty computes the next CalVer (base images are published FOR the release that follows them)"
        required: false
        default: ""
        type: string
      bucket:
        description: "R2 bucket"
        required: true
        default: frameos-archive
        type: string
      prefix:
        description: "R2 object prefix"
        required: true
        default: buildroot-images
        type: string
      force_upload:
        description: "Replace an existing object with the same key"
        required: true
        default: false
        type: boolean
      buildroot_jlevel:
        description: "Buildroot BR2_JLEVEL; 0 lets Buildroot choose"
        required: true
        default: "0"
        type: string
      buildroot_docker_image:
        description: "Optional FRAMEOS_BUILDROOT_DOCKER_IMAGE override"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  resolve-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        env:
          PLATFORM: ${{ inputs.platform }}
          RUNNER_OVERRIDE: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          # Keep this list in sync with the dispatch choice options above and
          # enabled_buildroot_platforms() in buildroot_platforms.py. Parallel
          # publishes are safe by design: uploads upsert the R2 manifest (the
          # source of truth) and the commit step re-downloads the converged
          # manifest with a push-retry loop instead of rebasing local edits.
          if [ "${PLATFORM}" = "all" ]; then
            platforms=(raspberry-pi-32 raspberry-pi-64 raspberry-pi-5)
          else
            platforms=("${PLATFORM}")
          fi
          entries=()
          for platform in "${platforms[@]}"; do
            if [ -n "${RUNNER_OVERRIDE}" ]; then
              runner="${RUNNER_OVERRIDE}"
            else
              # 32-core Depot runners: a Buildroot build is compile-bound and
              # scales nearly linearly, and Depot serves actions/cache from
              # its own storage (faster restores, no 10GB repo quota
              # squeezing the ccache). Keep the arch split in sync with
              # default_runner_label in backend/app/tasks/buildroot_platforms.py:
              # 32-bit ARM targets build on x86_64 so the prebuilt Bootlin
              # toolchains apply.
              case "${platform}" in
                raspberry-pi-32) runner="depot-ubuntu-24.04-32" ;;
                *) runner="depot-ubuntu-24.04-arm-32" ;;
              esac
            fi
            entries+=("{\"platform\":\"${platform}\",\"runner\":\"${runner}\"}")
          done
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "Matrix: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish ${{ matrix.platform }}
    needs: resolve-matrix
    strategy:
      # One platform failing must not cancel the others mid-publish.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      PLATFORM: ${{ matrix.platform }}
      R2_BUCKET: ${{ inputs.bucket }}
      R2_PREFIX: ${{ inputs.prefix }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      FRAMEOS_BUILDROOT_JLEVEL: ${{ inputs.buildroot_jlevel }}
      FRAMEOS_BUILDROOT_CACHE_DIR: ${{ github.workspace }}/build/buildroot-images/cache
    steps:
      - name: Require branch dispatch
        if: github.ref_type != 'branch'
        run: |
          echo "Run this workflow against a branch so the manifest commit has a target."
          exit 1

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prepare branch checkout
        run: |
          set -euo pipefail
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The cache dir holds Buildroot downloads AND the ccache (BR2_CCACHE_DIR
      # points into it). The key ends in the run id ON PURPOSE: actions/cache
      # only saves when the exact key is new, so a content-hash key meant the
      # ccache warmed by a run was thrown away and every future run restored
      # the same increasingly stale snapshot. With a per-run key each run
      # restores the newest cache via restore-keys and saves its own warmer
      # one.
      #
      # The wiring is verified: buildroot_images.py bind-mounts this dir at
      # /cache and the generated config sets BR2_DL_DIR=/cache/dl and
      # BR2_CCACHE_DIR=/cache/ccache, so post-job saves are ~1.5-1.8GB.
      # Historical "restored 0 bytes" runs were NOT a path bug: saves on
      # GitHub-hosted runners went to the repo's 10GB GitHub cache where
      # turbo/buildx caches evicted them within hours, and Depot runners use
      # Depot's own cache store, which started cold. Cache continuity
      # therefore requires staying on Depot runners: a runner_label override
      # onto a GitHub-hosted runner reads/writes the other, quota-squeezed
      # store.
      - name: Restore Buildroot download + compiler cache
        uses: actions/cache@v4
        with:
          path: build/buildroot-images/cache
          key: buildroot-dl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
            buildroot-dl-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt boto3

      # Resolve the stamped version ONCE and pin it for every later step.
      # Base images are published FOR the release that follows them (publish
      # bases -> merge manifest -> bump versions -> release), so the stamp is
      # the next CalVer, not the current one. Recomputing it per step would
      # also let a build that runs across a month boundary stamp and verify
      # two different versions.
      - name: Resolve target version
        env:
          NEXT_VERSION_INPUT: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          version="$(FRAMEOS_NEXT_VERSION="${NEXT_VERSION_INPUT}" python3 -c "import sys; sys.path.insert(0, 'tools/buildroot-images'); import buildroot_images; print(buildroot_images.next_frameos_version())")"
          echo "FRAMEOS_NEXT_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Publishing base image as FrameOS ${version}"

      - name: Validate configuration
        env:
          BUILDROOT_DOCKER_IMAGE_OVERRIDE: ${{ inputs.buildroot_docker_image }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repository secrets must be set."
            exit 1
          fi
          if [ -z "${R2_ENDPOINT}" ] && [ -z "${R2_ACCOUNT_ID}" ]; then
            echo "Set either R2_ENDPOINT or R2_ACCOUNT_ID as a repository secret."
            exit 1
          fi
          if ! [[ "${FRAMEOS_BUILDROOT_JLEVEL}" =~ ^[0-9]+$ ]]; then
            echo "buildroot_jlevel must be an integer."
            exit 1
          fi
          if [ -n "${BUILDROOT_DOCKER_IMAGE_OVERRIDE}" ]; then
            echo "FRAMEOS_BUILDROOT_DOCKER_IMAGE=${BUILDROOT_DOCKER_IMAGE_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          mkdir -p "${FRAMEOS_BUILDROOT_CACHE_DIR}"
          docker version
          df -h
          python3 - <<'PY'
          import json
          from pathlib import Path

          versions = json.loads(Path("versions.json").read_text(encoding="utf-8"))
          print("FrameOS version:", str(versions["frameos"]).split("+", 1)[0])
          PY

      - name: Build Buildroot base image
        run: |
          set -euo pipefail
          python3 tools/buildroot-images/buildroot_images.py \
            --platform "${PLATFORM}" \
            --bucket "${R2_BUCKET}" \
            --prefix "${R2_PREFIX}" \
            --cache-dir "${FRAMEOS_BUILDROOT_CACHE_DIR}" \
            build

      - name: Upload Buildroot base image to R2
        env:
          FORCE_UPLOAD: ${{ inputs.force_upload }}
        run: |
          set -euo pipefail
          args=(
            --platform "${PLATFORM}"
            --bucket "${R2_BUCKET}"
            --prefix "${R2_PREFIX}"
            upload
            --yes
          )
          if [ "${FORCE_UPLOAD}" = "true" ]; then
            args+=(--force)
          fi
          python3 tools/buildroot-images/buildroot_images.py "${args[@]}"

      - name: Verify manifest
        run: |
          set -euo pipefail
          python3 tools/buildroot-images/buildroot_images.py \
            --platform "${PLATFORM}" \
            --bucket "${R2_BUCKET}" \
            --prefix "${R2_PREFIX}" \
            list
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["PLATFORM"]
          # The version the image was stamped with (Resolve target version),
          # not whatever versions.json currently says.
          version = os.environ["FRAMEOS_NEXT_VERSION"]
          manifest = json.loads(Path("tools/buildroot-images/manifest.json").read_text(encoding="utf-8"))
          matches = [
              entry
              for entry in manifest.get("entries", [])
              if entry.get("platform") == platform and entry.get("frameos_version") == version
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected one manifest entry for {platform} {version}, found {len(matches)}")
          entry = matches[0]
          required = ["object_key", "sha256", "size", "updated_at"]
          missing = [key for key in required if not entry.get(key)]
          if missing:
              raise SystemExit(f"Manifest entry is missing: {', '.join(missing)}")
          print(json.dumps(entry, indent=2, sort_keys=True))
          PY

      - name: Commit manifest changes
        run: |
          set -euo pipefail
          git config user.name "frameos-bot"
          git config user.email "git@frameos.net"
          # Pinned by the Resolve target version step — the next release's
          # version, which is what the entry was written under. Asking
          # versions.json here would look up an entry that was never written.
          version="${FRAMEOS_NEXT_VERSION}"
          # The manifest's source of truth is R2 — `upload` already upserted
          # this build's entry there. The repo copy is a mirror, so parallel
          # platform builds must NOT rebase their local mutations onto each
          # other (that ended in a manifest.json merge conflict after a
          # 90-minute build). Instead: re-download the converged manifest from
          # R2 on top of the current branch tip and retry when a concurrent
          # job pushes first.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            # --force: the checkout always carries a committed manifest.json,
            # and the R2 copy is the source of truth we are mirroring over it.
            python3 tools/buildroot-images/buildroot_images.py \
              --platform "${PLATFORM}" \
              --bucket "${R2_BUCKET}" \
              --prefix "${R2_PREFIX}" \
              download --force
            # R2's manifest upsert is read-modify-write: two uploads finishing
            # in the same instant could drop an entry. Committing a mirror
            # that lost OUR image would silently unpublish it — fail loudly
            # instead (rerunning the upload step with force_upload repairs it).
            python3 -c "import json, os, sys; m = json.load(open('tools/buildroot-images/manifest.json')); p = os.environ['PLATFORM']; v = '${version}'; sys.exit(0 if any(e.get('platform') == p and e.get('frameos_version') == v for e in m.get('entries', [])) else f'R2 manifest lost the {p} {v} entry (concurrent upload race) — rerun with force_upload')"
            git add tools/buildroot-images/manifest.json
            if git diff --cached --quiet; then
              echo "No manifest changes to commit."
              exit 0
            fi
            git commit -m "chore: refresh Buildroot base image manifest for ${version} (${PLATFORM})"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected — a concurrent build updated the branch; retrying (${attempt}/5)"
            sleep $((RANDOM % 20 + 5))
          done
          echo "Could not push the manifest after 5 attempts."
          exit 1

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-base-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            build/buildroot-images/${{ matrix.platform }}/**/metadata.json
            tools/buildroot-images/manifest.json
          if-no-files-found: warn
