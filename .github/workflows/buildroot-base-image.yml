name: Publish Buildroot base image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Buildroot platform to publish; 'all' builds every platform in parallel"
        required: true
        default: all
        type: choice
        options:
          - all
          - raspberry-pi-32
          - raspberry-pi-64
          - raspberry-pi-5
      runner_label:
        description: "Runner label override; empty uses the platform default (32-core Depot runners — x86_64 for 32-bit ARM targets so prebuilt Bootlin toolchains apply)"
        required: false
        default: ""
        type: string
      next_version:
        description: "Version to stamp the image with; empty computes the next CalVer (base images are published FOR the release that follows them)"
        required: false
        default: ""
        type: string
      bucket:
        description: "R2 bucket"
        required: true
        default: frameos-archive
        type: string
      prefix:
        description: "R2 object prefix"
        required: true
        default: buildroot-images
        type: string
      force_upload:
        description: "Replace an existing object with the same key"
        required: true
        default: false
        type: boolean
      buildroot_jlevel:
        description: "Buildroot BR2_JLEVEL; 0 lets Buildroot choose"
        required: true
        default: "0"
        type: string
      buildroot_docker_image:
        description: "Optional FRAMEOS_BUILDROOT_DOCKER_IMAGE override"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  # commit-manifest reads the per-platform "published" markers back out of the
  # run's artifacts. Naming any scope here zeroes the rest, so this is not
  # redundant.
  actions: read

jobs:
  resolve-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require branch dispatch
        if: github.ref_type != 'branch'
        run: |
          echo "Run this workflow against a branch so the manifest commit has a target."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Resolve the stamped version ONCE for the whole run and hand it to every
      # job as an output. Base images are published FOR the release that
      # follows them (publish bases -> merge manifest -> bump versions ->
      # release), so the stamp is the next CalVer, not the current one.
      # Resolving per-job would let builds that straddle a month boundary — or
      # the commit job, which runs an hour after the builds start — disagree
      # about which version they are publishing.
      #
      # base_version.py is deliberately stdlib-only: importing buildroot_images
      # would drag in the backend app and a minute of pip for one string.
      - id: version
        env:
          FRAMEOS_NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          version="$(python3 tools/buildroot-images/base_version.py)"
          echo "Publishing base images as FrameOS ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - id: resolve
        env:
          PLATFORM: ${{ inputs.platform }}
          RUNNER_OVERRIDE: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          # Keep this list in sync with the dispatch choice options above and
          # enabled_buildroot_platforms() in buildroot_platforms.py. Parallel
          # publishes are safe by design: uploads upsert the R2 manifest, which
          # is the source of truth, and a single commit-manifest job mirrors the
          # converged result into git once every platform has finished.
          if [ "${PLATFORM}" = "all" ]; then
            platforms=(raspberry-pi-32 raspberry-pi-64 raspberry-pi-5)
          else
            platforms=("${PLATFORM}")
          fi
          entries=()
          for platform in "${platforms[@]}"; do
            if [ -n "${RUNNER_OVERRIDE}" ]; then
              runner="${RUNNER_OVERRIDE}"
            else
              # 32-core Depot runners: a Buildroot build is compile-bound and
              # scales nearly linearly, and Depot serves actions/cache from
              # its own storage (faster restores, no 10GB repo quota
              # squeezing the ccache). Keep the arch split in sync with
              # default_runner_label in backend/app/tasks/buildroot_platforms.py:
              # 32-bit ARM targets build on x86_64 so the prebuilt Bootlin
              # toolchains apply.
              case "${platform}" in
                raspberry-pi-32) runner="depot-ubuntu-24.04-32" ;;
                *) runner="depot-ubuntu-24.04-arm-32" ;;
              esac
            fi
            entries+=("{\"platform\":\"${platform}\",\"runner\":\"${runner}\"}")
          done
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "Matrix: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish ${{ matrix.platform }}
    needs: resolve-matrix
    strategy:
      # One platform failing must not cancel the others mid-publish.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      PLATFORM: ${{ matrix.platform }}
      R2_BUCKET: ${{ inputs.bucket }}
      R2_PREFIX: ${{ inputs.prefix }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      FRAMEOS_BUILDROOT_JLEVEL: ${{ inputs.buildroot_jlevel }}
      FRAMEOS_BUILDROOT_CACHE_DIR: ${{ github.workspace }}/build/buildroot-images/cache
      # Pinned by resolve-matrix, not recomputed here — see the comment there.
      FRAMEOS_NEXT_VERSION: ${{ needs.resolve-matrix.outputs.version }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The cache dir holds Buildroot downloads AND the ccache (BR2_CCACHE_DIR
      # points into it). The key ends in the run id ON PURPOSE: actions/cache
      # only saves when the exact key is new, so a content-hash key meant the
      # ccache warmed by a run was thrown away and every future run restored
      # the same increasingly stale snapshot. With a per-run key each run
      # restores the newest cache via restore-keys and saves its own warmer
      # one.
      #
      # The wiring is verified: buildroot_images.py bind-mounts this dir at
      # /cache and the generated config sets BR2_DL_DIR=/cache/dl and
      # BR2_CCACHE_DIR=/cache/ccache, so post-job saves are ~1.5-1.8GB.
      # Historical "restored 0 bytes" runs were NOT a path bug: saves on
      # GitHub-hosted runners went to the repo's 10GB GitHub cache where
      # turbo/buildx caches evicted them within hours, and Depot runners use
      # Depot's own cache store, which started cold. Cache continuity
      # therefore requires staying on Depot runners: a runner_label override
      # onto a GitHub-hosted runner reads/writes the other, quota-squeezed
      # store.
      - name: Restore Buildroot download + compiler cache
        uses: actions/cache@v4
        with:
          path: build/buildroot-images/cache
          key: buildroot-dl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
            buildroot-dl-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt boto3

      - name: Validate configuration
        env:
          BUILDROOT_DOCKER_IMAGE_OVERRIDE: ${{ inputs.buildroot_docker_image }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repository secrets must be set."
            exit 1
          fi
          if [ -z "${R2_ENDPOINT}" ] && [ -z "${R2_ACCOUNT_ID}" ]; then
            echo "Set either R2_ENDPOINT or R2_ACCOUNT_ID as a repository secret."
            exit 1
          fi
          if ! [[ "${FRAMEOS_BUILDROOT_JLEVEL}" =~ ^[0-9]+$ ]]; then
            echo "buildroot_jlevel must be an integer."
            exit 1
          fi
          if [ -n "${BUILDROOT_DOCKER_IMAGE_OVERRIDE}" ]; then
            echo "FRAMEOS_BUILDROOT_DOCKER_IMAGE=${BUILDROOT_DOCKER_IMAGE_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          mkdir -p "${FRAMEOS_BUILDROOT_CACHE_DIR}"
          docker version
          df -h
          python3 - <<'PY'
          import json
          from pathlib import Path

          versions = json.loads(Path("versions.json").read_text(encoding="utf-8"))
          print("FrameOS version:", str(versions["frameos"]).split("+", 1)[0])
          PY

      - name: Build Buildroot base image
        run: |
          set -euo pipefail
          python3 tools/buildroot-images/buildroot_images.py \
            --platform "${PLATFORM}" \
            --bucket "${R2_BUCKET}" \
            --prefix "${R2_PREFIX}" \
            --cache-dir "${FRAMEOS_BUILDROOT_CACHE_DIR}" \
            build

      - name: Upload Buildroot base image to R2
        env:
          FORCE_UPLOAD: ${{ inputs.force_upload }}
        run: |
          set -euo pipefail
          args=(
            --platform "${PLATFORM}"
            --bucket "${R2_BUCKET}"
            --prefix "${R2_PREFIX}"
            upload
            --yes
          )
          if [ "${FORCE_UPLOAD}" = "true" ]; then
            args+=(--force)
          fi
          python3 tools/buildroot-images/buildroot_images.py "${args[@]}"

      - name: Verify manifest
        run: |
          set -euo pipefail
          python3 tools/buildroot-images/buildroot_images.py \
            --platform "${PLATFORM}" \
            --bucket "${R2_BUCKET}" \
            --prefix "${R2_PREFIX}" \
            list
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["PLATFORM"]
          # The version resolve-matrix pinned for this run, not whatever
          # versions.json currently says.
          version = os.environ["FRAMEOS_NEXT_VERSION"]
          manifest = json.loads(Path("tools/buildroot-images/manifest.json").read_text(encoding="utf-8"))
          matches = [
              entry
              for entry in manifest.get("entries", [])
              if entry.get("platform") == platform and entry.get("frameos_version") == version
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected one manifest entry for {platform} {version}, found {len(matches)}")
          entry = matches[0]
          required = ["object_key", "sha256", "size", "updated_at"]
          missing = [key for key in required if not entry.get(key)]
          if missing:
              raise SystemExit(f"Manifest entry is missing: {', '.join(missing)}")
          print(json.dumps(entry, indent=2, sort_keys=True))
          PY

      # commit-manifest cannot ask GitHub which legs of a fail-fast:false matrix
      # succeeded — `needs.publish.result` collapses to a single value — so each
      # leg leaves a marker naming itself. Written only if every step above
      # passed, so a failed platform contributes no marker and is not asserted
      # on. Uploading it (rather than a job output) is what keeps it per-leg:
      # matrix job outputs overwrite each other.
      - name: Record published platform
        run: |
          set -euo pipefail
          mkdir -p build/published
          echo "${FRAMEOS_NEXT_VERSION}" > "build/published/${PLATFORM}"

      - name: Upload published marker
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-published-${{ matrix.platform }}-${{ github.run_id }}
          path: build/published/${{ matrix.platform }}
          if-no-files-found: error

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-base-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            build/buildroot-images/${{ matrix.platform }}/**/metadata.json
            tools/buildroot-images/manifest.json
          if-no-files-found: warn

  # One commit for the whole run, after every platform has finished. Previously
  # each platform committed its own mirror of the manifest, which meant N
  # commits racing to push the same file: the losers reset, re-downloaded the
  # already-converged manifest, found nothing left to add and exited with "No
  # manifest changes to commit" — correct, but it left runs where a platform
  # published successfully and no commit bore its name, which reads exactly
  # like a lost build.
  commit-manifest:
    name: Commit manifest
    needs: [resolve-matrix, publish]
    # Not `always()`: a cancelled run should not push. But a partial failure
    # should still mirror the platforms that did publish, so this cannot depend
    # on `publish` succeeding outright either.
    if: ${{ !cancelled() && needs.resolve-matrix.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      R2_BUCKET: ${{ inputs.bucket }}
      R2_PREFIX: ${{ inputs.prefix }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      FRAMEOS_NEXT_VERSION: ${{ needs.resolve-matrix.outputs.version }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download published markers
        uses: actions/download-artifact@v4
        with:
          pattern: buildroot-published-*-${{ github.run_id }}
          path: build/published
          merge-multiple: true

      - name: Collect published platforms
        id: published
        run: |
          set -euo pipefail
          # mkdir, not `ls 2>/dev/null`: when every platform failed there are no
          # marker artifacts, download-artifact creates nothing, and a failing
          # `ls` at the head of a pipefail pipeline would abort the step before
          # it could report the empty result.
          mkdir -p build/published
          platforms="$(ls build/published | tr '\n' ' ' | sed 's/ $//')"
          if [ -z "${platforms}" ]; then
            echo "No platform published successfully — nothing to mirror."
          else
            echo "Published: ${platforms}"
          fi
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        if: steps.published.outputs.platforms != ''
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt boto3

      - name: Commit manifest changes
        if: steps.published.outputs.platforms != ''
        env:
          PUBLISHED_PLATFORMS: ${{ steps.published.outputs.platforms }}
        run: |
          set -euo pipefail
          git config user.name "frameos-bot"
          git config user.email "git@frameos.net"
          version="${FRAMEOS_NEXT_VERSION}"
          # R2 is the manifest's source of truth — every `upload` already
          # upserted its entry there. The repo copy is a mirror, so this never
          # edits it locally: it re-downloads the converged manifest on top of
          # the branch tip. The retry loop now only covers unrelated pushes to
          # the branch, not sibling platforms.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            # --force: the checkout always carries a committed manifest.json,
            # and the R2 copy is what we are mirroring over it.
            python3 tools/buildroot-images/buildroot_images.py \
              --bucket "${R2_BUCKET}" \
              --prefix "${R2_PREFIX}" \
              download --force
            # R2's manifest upsert is read-modify-write: two uploads finishing
            # in the same instant could drop an entry. Committing a mirror that
            # lost an image would silently unpublish it — fail loudly instead
            # (rerunning the upload step with force_upload repairs it).
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["FRAMEOS_NEXT_VERSION"]
          expected = os.environ["PUBLISHED_PLATFORMS"].split()
          manifest = json.loads(Path("tools/buildroot-images/manifest.json").read_text(encoding="utf-8"))
          entries = manifest.get("entries", [])
          missing = [
              platform
              for platform in expected
              if not any(
                  entry.get("platform") == platform and entry.get("frameos_version") == version
                  for entry in entries
              )
          ]
          if missing:
              raise SystemExit(
                  f"R2 manifest lost the {version} entry for: {', '.join(missing)} "
                  "(concurrent upload race) — rerun those platforms with force_upload"
              )
          print(f"Manifest carries {version} for: {', '.join(expected)}")
          PY
            git add tools/buildroot-images/manifest.json
            if git diff --cached --quiet; then
              echo "Manifest already up to date on ${GITHUB_REF_NAME}; nothing to commit."
              exit 0
            fi
            git commit -m "chore: refresh Buildroot base image manifest for ${version} (${PUBLISHED_PLATFORMS// /, })"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected — the branch moved; retrying (${attempt}/5)"
            sleep $((RANDOM % 20 + 5))
          done
          echo "Could not push the manifest after 5 attempts."
          exit 1

      - name: Fail if any platform did not publish
        if: ${{ needs.publish.result != 'success' }}
        run: |
          echo "At least one platform failed to publish; the manifest mirrors only the ones that succeeded."
          exit 1
