name: FrameOS cross compilation

on:
  workflow_dispatch:
    inputs:
      toolchain_image_tag:
        description: "Cross-toolchain image tag (optional override)"
        required: false
        default: ""
        type: string
      toolchain_image:
        description: "Cross-toolchain image override (optional)"
        required: false
        default: ""
        type: string
  # Per-frame source builds are the legacy path (docs/convergence-todo.md,
  # Stage 4; docs/legacy-source-builds.md): this workflow compiles a frame's
  # checked-in frame.json against every target and five driver variants, which
  # is exactly what the backend no longer does by default. It runs on merges
  # to main so a toolchain regression still surfaces before a release, and on
  # demand — no longer on every pull request. The release itself is built by
  # docker-publish-multi.yml (`make release-%`), the toolchain image by
  # frameos-cross-toolchain.yml.
  push:
    branches:
      - main
    paths:
      - frameos/**
      - backend/app/codegen/release_drivers_nim.py
      - backend/app/drivers/waveshare.py
      - backend/app/utils/cross_compile.py
      - backend/app/tasks/_frame_deployer.py
      - backend/bin/cross
      - backend/tools/cross-toolchain.Dockerfile
      - .github/workflows/frameos-cross.yml

# Superseded runs on the same branch are cancelled; manual dispatches always
# run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  determine-matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          MATRIX=$(python backend/bin/cross matrix)
          echo "targets=$MATRIX" >> "$GITHUB_OUTPUT"

  cross-build:
    needs: determine-matrix
    runs-on: ${{ matrix.runner }}
    env:
      FRAMEOS_CROSS_TOOLCHAIN_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain_image_tag || '' }}
      FRAMEOS_CROSS_TOOLCHAIN_IMAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain_image || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-matrix.outputs.targets) }}
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the self-hosted
      # runner pool's address; nimble's fetch-by-commit died on it across a
      # whole push while HTTP/1.1 from the same host succeeded every time.
      # Harmless on GitHub-hosted runners.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
      - name: Install Nim (prebuilt)
        env:
          NIM_VERSION: 2.2.4
        run: |
          set -euo pipefail
          distro=$(lsb_release -si | tr '[:upper:]' '[:lower:]')
          version=$(lsb_release -sr)
          case "$(uname -m)" in
            aarch64) host_arch=arm64 ;;
            armv7l|armv6l) host_arch=armhf ;;
            x86_64) host_arch=amd64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          nim_slug="${distro}-${version}-${host_arch}"
          echo $nim_slug
          # The archive digest must be on the committed list or the runner
          # refuses it: the CDN alone is not a trust anchor (recipe for a new
          # Nim at the top of .github/nim-prebuilt.sha256).
          expected="$(grep -E "^[0-9a-f]{64}  ${nim_slug}/nim-${NIM_VERSION}\.tar\.gz$" .github/nim-prebuilt.sha256 | cut -d' ' -f1 || true)"
          if [ -z "$expected" ]; then
            echo "::error::no sha256 recorded for ${nim_slug}/nim-${NIM_VERSION}.tar.gz in .github/nim-prebuilt.sha256"
            exit 1
          fi
          mkdir -p "$HOME/.nim"
          curl -fsSL --retry 3 "https://archive.frameos.net/prebuilt-deps/${nim_slug}/nim-${NIM_VERSION}.tar.gz" -o /tmp/nim.tar.gz
          echo "${expected}  /tmp/nim.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nim.tar.gz -C "$HOME/.nim"
          rm -rf "$HOME/.nim/nim-2.2.4/nim/bin"
          mv $HOME/.nim/nim-2.2.4/nim/* "$HOME/.nim/nim-2.2.4/"
          echo "$HOME/.nim/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nim/nim-${NIM_VERSION}/bin:$PATH"
          nim --version
      - name: Cross compile ${{ matrix.slug }}
        run: |
          cd frameos
          cat frame.json
          make cross-${{ matrix.slug }}

  driver-variant-builds:
    needs: determine-matrix
    runs-on: ubuntu-24.04
    env:
      FRAMEOS_CROSS_TOOLCHAIN_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain_image_tag || '' }}
      FRAMEOS_CROSS_TOOLCHAIN_IMAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain_image || '' }}
      TARGET_SLUG: debian-trixie-amd64
      TARGET_PLATFORM: linux/amd64
      TARGET_IMAGE: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: web-only
            device: web_only
          - label: hdmi
            device: framebuffer
          - label: waveshare-7.3e
            device: waveshare.EPD_7in3e
          - label: waveshare-13.3e
            device: waveshare.EPD_13in3e
          - label: pimoroni-13.3
            device: pimoroni.inky_impression_13
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the self-hosted
      # runner pool's address; nimble's fetch-by-commit died on it across a
      # whole push while HTTP/1.1 from the same host succeeded every time.
      # Harmless on GitHub-hosted runners.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
      - name: Install Nim (prebuilt)
        env:
          NIM_VERSION: 2.2.4
        run: |
          set -euo pipefail
          distro=$(lsb_release -si | tr '[:upper:]' '[:lower:]')
          version=$(lsb_release -sr)
          case "$(uname -m)" in
            aarch64) host_arch=arm64 ;;
            armv7l|armv6l) host_arch=armhf ;;
            x86_64) host_arch=amd64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          nim_slug="${distro}-${version}-${host_arch}"
          echo "$nim_slug"
          # The archive digest must be on the committed list or the runner
          # refuses it: the CDN alone is not a trust anchor (recipe for a new
          # Nim at the top of .github/nim-prebuilt.sha256).
          expected="$(grep -E "^[0-9a-f]{64}  ${nim_slug}/nim-${NIM_VERSION}\.tar\.gz$" .github/nim-prebuilt.sha256 | cut -d' ' -f1 || true)"
          if [ -z "$expected" ]; then
            echo "::error::no sha256 recorded for ${nim_slug}/nim-${NIM_VERSION}.tar.gz in .github/nim-prebuilt.sha256"
            exit 1
          fi
          mkdir -p "$HOME/.nim"
          curl -fsSL --retry 3 "https://archive.frameos.net/prebuilt-deps/${nim_slug}/nim-${NIM_VERSION}.tar.gz" -o /tmp/nim.tar.gz
          echo "${expected}  /tmp/nim.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nim.tar.gz -C "$HOME/.nim"
          rm -rf "$HOME/.nim/nim-${NIM_VERSION}/nim/bin"
          mv "$HOME/.nim/nim-${NIM_VERSION}/nim/"* "$HOME/.nim/nim-${NIM_VERSION}/"
          echo "$HOME/.nim/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nim/nim-${NIM_VERSION}/bin:$PATH"
          nim --version
      - name: "Configure frame device (driver: ${{ matrix.label }})"
        run: |
          tmp=$(mktemp)
          jq --arg device "${{ matrix.device }}" '.device = $device' frameos/frame.json > "$tmp"
          mv "$tmp" frameos/frame.json
          cat frameos/frame.json | jq '.device'
      - name: Cross compile ${{ env.TARGET_SLUG }} (${{ matrix.label }})
        run: |
          cd frameos
          cat frame.json
          make cross-${TARGET_SLUG}
