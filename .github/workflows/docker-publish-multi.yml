name: Release FrameOS

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Optional release version override, for example 2026.6.0'
        required: false
        type: string

permissions:
  actions: write
  contents: write

jobs:
  # Runner sizing (post-Depot-runners, 2026-08): the bookkeeping jobs
  # (version bump, npm dispatch, release notes, matrix, addon repo, GitHub
  # release, the push-multiarch orchestrator) are I/O bound and run on free
  # GitHub-hosted runners. The compute-heavy jobs run on the self-hosted
  # EPYC pool ("epyc-32" / "epyc-8" = ephemeral Incus VMs on the monster
  # host, see tools/gha-runners/README.md): Buildroot release image on
  # the 32-core slot, ESP32 firmware on an 8-core slot. Cross builds split
  # per-arch — amd64/armv6 on epyc-8, arm64+armhf on GitHub's free ARM
  # runners — see backend/bin/cross for the mapping and measurements. The
  # container images build with buildx against a registry layer cache on
  # GHCR: the esp32-ci cache that e2e-docker.yml writes
  # on every push to main, and one cache per platform for the runtime image
  # that build-runtime-image writes per release. Nothing paid is left in
  # the workflow (Depot, 2026-11).
  #
  # GitHub-hosted jobs are pinned to ubuntu-24.04, not ubuntu-latest (26.04
  # since 2026-10-22). On 26.04 the signing steps fail: the system Python is
  # 3.14 and tools/requirements-signing.txt pins cp312 wheels (cffi). The Pico
  # build fails too: pico-sdk 2.1.1's pioasm does not build under GCC 15. A
  # release can't be tried out first, so move these jobs to a new image only
  # after both are fixed.
  update-versions:
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.release-ref.outputs.release_sha }}
      docker_version: ${{ steps.release-ref.outputs.docker_version }}
      release_tag: ${{ steps.release-ref.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recompute component versions
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          # `docker` is the release itself. `frameos` rides along on purpose:
          # the runtime binary is compiled with versions.json's `frameos` entry
          # (frameos/Makefile -> -d:frameosVersion) and reports it to the cloud,
          # the hub and its own upgrade check. Left to its content hash, a
          # release that touched nothing under frameos/ (2026.9.2 changed only
          # this workflow) ships a runtime still stamped with the previous
          # version: every frame that installed "2026.9.2" came back reporting
          # 2026.9.1, the cloud kept offering the update, and the upgrade
          # re-ran to nowhere. The release tag and the runtime's version must
          # be the same number.
          args=(--force-project docker --force-project frameos)
          if [ -n "$NEXT_VERSION" ]; then
            args+=(--next-version "$NEXT_VERSION")
          fi
          python3 tools/update_versions.py "${args[@]}"

      - name: Verify version changes
        run: |
          if git diff --quiet -- versions.json; then
            echo "Release did not change versions.json"
            exit 1
          fi
          echo "Version changes detected"

      - name: Commit updated versions
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['docker'].split('+', 1)[0])")
          git config user.name "frameos-bot"
          git config user.email "git@frameos.net"
          # update_versions.py syncs the wasm package to the FrameOS runtime
          # version, the editor package to its independent frontend hash, and
          # the standalone setup script's fallback release to this release.
          git add versions.json frameos/wasm/package.json frameos/editor/package.json scripts/frameos-setup.sh
          git commit -m "chore: version ${VERSION}"
          git push origin HEAD:main

      - name: Select release commit
        id: release-ref
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['docker'].split('+', 1)[0])")
          {
            echo "release_sha=$(git rev-parse HEAD)"
            echo "docker_version=$VERSION"
            echo "release_tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish FrameOS npm packages
    needs: [update-versions, build-wasm-runtime]
    runs-on: ubuntu-24.04
    steps:
      # npm auth uses trusted publishing (OIDC), which matches on the
      # top-level workflow file — so publishing lives in npm-publish.yml and
      # is dispatched here rather than run inline. That workflow is also
      # manually dispatchable to re-publish without bumping versions.
      # The run id lets it download the wasm runtime this run already built
      # (build-wasm-runtime) instead of compiling a second copy: the npm
      # package then ships byte-for-byte what the release attached.
      - name: Dispatch npm publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.update-versions.outputs.release_sha }}
        run: |
          gh workflow run npm-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f ref="$RELEASE_SHA" \
            -f runtime_run_id="$GITHUB_RUN_ID"

  release-notes:
    name: Generate Release Notes
    needs: update-versions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}
          fetch-depth: 0

      - name: Generate release notes
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
          RELEASE_TAG: ${{ needs.update-versions.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.update-versions.outputs.release_sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 tools/generate_release_notes.py \
            --version "$DOCKER_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --head "$RELEASE_SHA" \
            --output release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ needs.update-versions.outputs.docker_version }}
          path: release-notes.md
          if-no-files-found: error

  determine-release-targets:
    needs: update-versions
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - id: set-matrix
        run: |
          MATRIX=$(python3 backend/bin/cross matrix)
          echo "targets=$MATRIX" >> "$GITHUB_OUTPUT"

  build-prebuilt-cross:
    name: Build Prebuilt Cross (${{ matrix.slug }})
    needs: [update-versions, determine-release-targets]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-release-targets.outputs.targets) }}
    steps:
      # Anonymous git over HTTP/2 is throttled by GitHub from the self-hosted
      # runner pool's address: nimble's fetch of QRgen died with "expected
      # flush after ref listing" on all six epyc-8 legs of the 2026.9.1 run
      # while the GitHub-hosted ARM legs sailed through. HTTP/1.1 from the
      # same host succeeds every time (frameos-cross.yml and
      # pull-request-tests.yml carry the same step). Harmless on GitHub-hosted
      # runners.
      - name: Use HTTP/1.1 toward github.com
        run: git config --global http.https://github.com/.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # Cache pip's wheel cache: installing backend requirements from a warm
      # cache saves ~35-45s on each of the 11 matrix jobs.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r backend/requirements.txt

      - name: Install Nim (prebuilt)
        env:
          NIM_VERSION: 2.2.4
        run: |
          set -euo pipefail
          distro=$(lsb_release -si | tr '[:upper:]' '[:lower:]')
          version=$(lsb_release -sr)
          case "$(uname -m)" in
            aarch64) host_arch=arm64 ;;
            armv7l|armv6l) host_arch=armhf ;;
            x86_64) host_arch=amd64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          nim_slug="${distro}-${version}-${host_arch}"
          echo "$nim_slug"
          # The archive digest must be on the committed list or the runner
          # refuses it: the CDN alone is not a trust anchor (recipe for a new
          # Nim at the top of .github/nim-prebuilt.sha256).
          expected="$(grep -E "^[0-9a-f]{64}  ${nim_slug}/nim-${NIM_VERSION}\.tar\.gz$" .github/nim-prebuilt.sha256 | cut -d' ' -f1 || true)"
          if [ -z "$expected" ]; then
            echo "::error::no sha256 recorded for ${nim_slug}/nim-${NIM_VERSION}.tar.gz in .github/nim-prebuilt.sha256"
            exit 1
          fi
          mkdir -p "$HOME/.nim"
          curl -fsSL --retry 3 "https://archive.frameos.net/prebuilt-deps/${nim_slug}/nim-${NIM_VERSION}.tar.gz" -o /tmp/nim.tar.gz
          echo "${expected}  /tmp/nim.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nim.tar.gz -C "$HOME/.nim"
          rm -rf "$HOME/.nim/nim-${NIM_VERSION}/nim/bin"
          mv "$HOME/.nim/nim-${NIM_VERSION}/nim/"* "$HOME/.nim/nim-${NIM_VERSION}/"
          echo "$HOME/.nim/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nim/nim-${NIM_VERSION}/bin:$PATH"
          nim --version

      - name: Build release artifacts for ${{ matrix.slug }}
        run: |
          cd frameos
          make release-${{ matrix.slug }}

      - name: Package release artifacts
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
          TARGET_SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p release-assets
          archive_root="frameos-${DOCKER_VERSION}-${TARGET_SLUG}"
          mkdir -p "release-assets/${archive_root}"
          cp -a "frameos/build/prebuilt-cross/${TARGET_SLUG}/." "release-assets/${archive_root}/"
          tar -czf "release-assets/${archive_root}.tar.gz" \
            -C release-assets \
            "${archive_root}"
          rm -rf "release-assets/${archive_root}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameos-${{ needs.update-versions.outputs.docker_version }}-${{ matrix.slug }}
          path: release-assets/*.tar.gz
          if-no-files-found: error

  build-buildroot-release-image:
    name: Build Buildroot Release Image
    needs: [update-versions, build-prebuilt-cross]
    # The one 32-core slot on the self-hosted pool; assembles the release
    # image from the prebuilt R2 base image, so it queues behind nothing
    # else in this workflow (the ESP32 job uses an epyc-8 slot).
    runs-on: epyc-32
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - name: Download prebuilt cross artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frameos-${{ needs.update-versions.outputs.docker_version }}-*
          path: release-assets
          merge-multiple: true

      # Same warm pip cache as the cross matrix: this job's requirements
      # install spent ~31s of its ~150s wall clock building cffi from sdist.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r backend/requirements.txt

      - name: Build Buildroot release images
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
        run: |
          set -euo pipefail
          # Build a release image for every enabled platform that has a
          # cached Buildroot base image in the checked-in manifest.
          platforms=$(python3 - <<'PY'
          import contextlib
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "backend")
          # Importing app.tasks pulls in the whole backend, which may emit
          # diagnostics at import time (e.g. SQLite warnings). Keep stdout
          # clean: it is captured as the platform list below.
          with contextlib.redirect_stdout(sys.stderr):
              from app.tasks.buildroot_platforms import enabled_buildroot_platforms

          manifest = json.loads(Path("tools/buildroot-images/manifest.json").read_text(encoding="utf-8"))
          available = {entry.get("platform") for entry in manifest.get("entries", [])}
          for platform in enabled_buildroot_platforms():
              if platform.key in available:
                  print(platform.key)
              else:
                  print(f"Skipping {platform.key}: no cached Buildroot base image in manifest", file=sys.stderr)
          PY
          )
          if [ -z "$platforms" ]; then
            echo "No Buildroot platforms with cached base images found." >&2
            exit 1
          fi
          # One platform per background job. Each build works in its own
          # tempdir and writes its own frameos-<version>-<platform>-* files,
          # so the only shared state is the read-mostly Buildroot base image
          # cache (one distinct file per platform). Sequentially the two
          # platforms cost 55s + 38s; in parallel the step is as long as the
          # slowest one. Output is captured per platform and replayed in
          # order afterwards so the log stays readable.
          pids=()
          names=()
          for platform in $platforms; do
            echo "Building release image for ${platform}"
            python3 tools/buildroot-images/buildroot_images.py \
              --platform "$platform" \
              release-image \
              --prebuilt-cross-dir release-assets \
              --release-assets-dir release-assets \
              --version "$DOCKER_VERSION" \
              > "buildroot-release-${platform}.log" 2>&1 &
            pids+=("$!")
            names+=("$platform")
          done
          status=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "Buildroot release image failed for ${names[$index]}" >&2
              status=1
            fi
          done
          for platform in "${names[@]}"; do
            echo "::group::Buildroot release image ${platform}"
            cat "buildroot-release-${platform}.log"
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          ls -lh release-assets/*.img.gz release-assets/*.metadata.json

      - name: Upload Buildroot release images
        uses: actions/upload-artifact@v4
        with:
          name: frameos-${{ needs.update-versions.outputs.docker_version }}-buildroot-images
          path: |
            release-assets/*.img.gz
            release-assets/*.metadata.json
          if-no-files-found: error

  # Prebuilt ESP32 firmware with no baked credentials: WiFi and cloud config
  # are provisioned after flashing via the captive portal, the serial console,
  # or the cloud browser flasher (cloud_url + claim_token over the USB API —
  # docs/cloud-frames.md). Every supported Waveshare panel driver is compiled
  # in and the active panel is chosen at runtime (`set panel <key>` on the
  # serial console or the setup portal dropdown); FRAMEOS_SELECTED_PANEL only
  # sets the boot-time default, kept at EPD_7in5_V2 for backward compat.
  # The binary is published as -generic.bin only. The transitional
  # -epd7in5v2.bin duplicate is gone: the cloud firmware route has read
  # -generic.bin from release metadata since the same release cycle, no
  # shipped firmware ever requested the old name for OTA, and old releases
  # keep the asset they were published with.
  build-esp32-generic-firmware:
    name: Build ESP32 firmware (generic, all panels)
    needs: [update-versions]
    # Self-hosted 8-core slot; the esp32-ci image is rebuilt from the GHCR
    # layer cache that e2e-docker.yml keeps warm, idf.py runs here.
    runs-on: epyc-8
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read-only against the esp32-ci layer cache (the comment on the same
      # step in e2e-docker.yml): the toolchain layers are cache hits, the
      # per-commit tail builds here. Same target and context as that job,
      # so the cache it writes is the cache this reads. load: true puts the
      # image into the local Docker daemon for the `docker run` below.
      - name: Build ESP32 CI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: esp32-ci
          tags: frameos-esp32-ci
          load: true
          push: false
          cache-from: type=registry,ref=ghcr.io/frameos/frameos-build-cache:esp32-ci

      - name: Build firmware
        timeout-minutes: 60
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # DOCKER_VERSION is passed into the container instead of spliced into
          # the inner single-quoted script, so the value is never re-parsed by
          # the container's shell.
          docker run --rm \
            -e FRAMEOS_SELECTED_PANEL=EPD_7in5_V2 \
            -e DOCKER_VERSION \
            -e FRAMEOS_VERSION="$DOCKER_VERSION" \
            -v "$PWD/release-assets:/release-assets" \
            frameos-esp32-ci \
            bash -lc '
              set -euo pipefail
              bash embedded/esp32/ci_build_image.sh
              cp embedded/esp32/build-ci/merged-binary.bin \
                "/release-assets/frameos-$DOCKER_VERSION-esp32-s3-generic.bin"
              # TWO artifacts per platform, and they are not interchangeable:
              # merged-binary.bin is the whole flash from 0x0 (bootloader +
              # partition table + blank otadata + app) and is what a USB
              # flasher writes, while frameos_esp32.bin is the bare app image
              # — the ONLY thing esp_ota_write accepts. Handing an OTA slot the
              # merged image fails validation (its first bytes are the
              # bootloader, which carries no esp_app_desc), so the cloud OTA
              # manifest serves this one. Same split the self-hosted backend
              # makes (backend/app/api/embedded_device.py).
              cp embedded/esp32/build-ci/frameos_esp32.bin \
                "/release-assets/frameos-$DOCKER_VERSION-esp32-s3-generic-app.bin"
              # Size document (totals + per-subsystem linker-map breakdown):
              # the baseline the PR size-report job diffs against.
              cp embedded/esp32/build-ci/firmware-size.json \
                "/release-assets/frameos-$DOCKER_VERSION-esp32-s3-generic-size.json"
              # ESP32-C3 thin-client firmware (TRMNL OG/BWRY, XTEINK X4):
              # 4MB no-OTA layout, no on-device Nim renderer.
              FRAMEOS_ESP32_PLATFORM=esp32-c3 \
                FRAMEOS_ESP32_BUILD_DIR=build-ci-c3 \
                bash embedded/esp32/ci_build_image.sh
              cp embedded/esp32/build-ci-c3/merged-binary.bin \
                "/release-assets/frameos-$DOCKER_VERSION-esp32-c3-generic.bin"
              # No OTA slot in the C3 4MB layout, so its app image is
              # published for symmetry/debugging only — nothing consumes it.
              cp embedded/esp32/build-ci-c3/frameos_esp32.bin \
                "/release-assets/frameos-$DOCKER_VERSION-esp32-c3-generic-app.bin"
              cp embedded/esp32/build-ci-c3/firmware-size.json \
                "/release-assets/frameos-$DOCKER_VERSION-esp32-c3-generic-size.json"
            '
          ls -lh release-assets/

      # NOT signed here. This job runs on a self-hosted runner slot — the same
      # host that runs fork-PR VMs — and the firmware signing key must never be
      # present there. The github-release job (GitHub-hosted) signs every
      # frameos-*.bin it downloads, exactly as it signs the Linux archives;
      # the device-side verification and the cloud's 409 unsigned_release make
      # a release with an unsigned image fail there, loudly.
      - name: Upload ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          # The github-release job downloads artifacts by the
          # frameos-<version>-* name pattern, so this name must keep that
          # prefix.
          name: frameos-${{ needs.update-versions.outputs.docker_version }}-esp32-generic
          path: |
            release-assets/*-esp32-s3-generic.bin
            release-assets/*-esp32-s3-generic-app.bin
            release-assets/*-esp32-c3-generic.bin
            release-assets/*-esp32-c3-generic-app.bin
            release-assets/*-esp32-s3-generic-size.json
            release-assets/*-esp32-c3-generic-size.json
          if-no-files-found: error

  # The same firmware on every other flash layout a board can have: one signed
  # image per chip × {4mb,8mb,16mb,32mb}, minus the two the generic pair
  # already IS (esp32-s3 = 8MB, esp32-c3 = 4MB). A backend then flashes a
  # 16MB XTEINK X4 or a 32MB 13.3E6 board with the partition table it actually
  # has instead of the generic image's, which is step 1 of docs/todo.md "the
  # self-hosted backend flashes what the cloud flashes". One job per chip on
  # GitHub-hosted runners (the three layouts share one build tree and, on the
  # S3, one Nim compile) so nothing here queues behind the epyc pool; the
  # generic job above stays exactly as it was — the cloud flasher depends on
  # its assets.
  build-esp32-layout-firmware:
    name: Build ESP32 firmware per flash layout
    needs: [update-versions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32-s3
            layouts: "4mb 16mb 32mb"
          - chip: esp32-c3
            layouts: "8mb 16mb 32mb"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same target, context and cache as the generic job's build: read-only.
      - name: Build ESP32 CI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: esp32-ci
          tags: frameos-esp32-ci
          load: true
          push: false
          cache-from: type=registry,ref=ghcr.io/frameos/frameos-build-cache:esp32-ci

      - name: Build firmware
        timeout-minutes: 60
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
          CHIP: ${{ matrix.chip }}
          LAYOUTS: ${{ matrix.layouts }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Values reach the container through the environment, never spliced
          # into the inner script (same reason as the generic job).
          docker run --rm \
            -e FRAMEOS_SELECTED_PANEL=EPD_7in5_V2 \
            -e DOCKER_VERSION \
            -e CHIP \
            -e LAYOUTS \
            -e FRAMEOS_VERSION="$DOCKER_VERSION" \
            -v "$PWD/release-assets:/release-assets" \
            frameos-esp32-ci \
            bash -lc '
              set -euo pipefail
              for layout in $LAYOUTS; do
                platform="$CHIP-$layout"
                # Fresh build dir per layout (the script refuses to reuse one);
                # the Nim side is shared through nimcache.
                FRAMEOS_ESP32_PLATFORM="$platform" \
                  FRAMEOS_ESP32_BUILD_DIR="build-ci-$layout" \
                  bash embedded/esp32/ci_build_image.sh
                # Same trio as the generic assets, same meaning: the merged
                # image is what a USB flasher writes from 0x0, -app.bin is the
                # bare app image an OTA slot accepts, -size.json is the
                # size-report baseline for this layout.
                cp "embedded/esp32/build-ci-$layout/merged-binary.bin" \
                  "/release-assets/frameos-$DOCKER_VERSION-$platform.bin"
                cp "embedded/esp32/build-ci-$layout/frameos_esp32.bin" \
                  "/release-assets/frameos-$DOCKER_VERSION-$platform-app.bin"
                cp "embedded/esp32/build-ci-$layout/firmware-size.json" \
                  "/release-assets/frameos-$DOCKER_VERSION-$platform-size.json"
              done
            '
          ls -lh release-assets/

      # Same signing step as the generic job: every image gets its .minisig,
      # a missing secret fails the release.
      - name: Sign ESP32 firmware
        env:
          FRAMEOS_FIRMWARE_SIGNING_KEY: ${{ secrets.FRAMEOS_FIRMWARE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FRAMEOS_FIRMWARE_SIGNING_KEY:-}" ]; then
            echo "::error::FRAMEOS_FIRMWARE_SIGNING_KEY secret is not set — refusing to publish unsigned firmware"
            exit 1
          fi
          # Hash-pinned (tools/requirements-signing.txt): this runner holds
          # the signing key, so nothing unverified from PyPI runs on it.
          python3 -m pip install --quiet --require-hashes --break-system-packages \
              -r tools/requirements-signing.txt \
            || python3 -m pip install --quiet --require-hashes -r tools/requirements-signing.txt
          keyfile=$(mktemp)
          printf '%s\n' "$FRAMEOS_FIRMWARE_SIGNING_KEY" > "$keyfile"
          status=0
          python3 tools/sign_firmware.py sign --secret "$keyfile" \
            release-assets/frameos-*.bin || status=$?
          shred -u "$keyfile"
          [ "$status" -eq 0 ] || exit "$status"
          for bin in release-assets/frameos-*.bin; do
            python3 tools/sign_firmware.py verify \
              --public release-assets/firmware-signing.pub "$bin"
          done
          ls -lh release-assets/

      - name: Upload ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          # Downloaded by the github-release job by the frameos-<version>-*
          # name pattern.
          name: frameos-${{ needs.update-versions.outputs.docker_version }}-${{ matrix.chip }}-layouts
          path: |
            release-assets/*-${{ matrix.chip }}-*mb.bin
            release-assets/*-${{ matrix.chip }}-*mb.bin.minisig
            release-assets/*-${{ matrix.chip }}-*mb-app.bin
            release-assets/*-${{ matrix.chip }}-*mb-app.bin.minisig
            release-assets/*-${{ matrix.chip }}-*mb-size.json
          if-no-files-found: error

  # The interpreted-scene runtime compiled to WebAssembly: what the cloud's
  # browser preview and headless renderer run, and what the frameos-wasm npm
  # package ships. Built once here from the release commit and attached to
  # the release as frameos-<version>-wasm.tar.gz — signed with the firmware
  # key in the github-release job like every other .tar.gz — so FrameOS
  # Cloud installs the runtime frames actually run instead of compiling one
  # from main (cloud/apps/auth-web/scripts/lib/wasm-runtime.mjs pins the
  # release version from versions.json and verifies the .minisig). The npm
  # publish job downloads this artifact rather than building again.
  build-wasm-runtime:
    name: Build wasm runtime
    needs: [update-versions]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      # Same Nim toolchain cache as npm-publish.yml, for the same reason
      # (nim-lang.org drops connections often enough to fail real runs).
      - name: Cache Nim toolchain
        id: cache_nim_toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.choosenim
            ~/.nimble/bin
          key: ${{ runner.os }}-nim-toolchain-2.2.4

      - uses: jiro4989/setup-nim-action@v1
        if: steps.cache_nim_toolchain.outputs.cache-hit != 'true'
        id: setup_nim
        continue-on-error: true
        with:
          nim-version: 2.2.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry Nim setup once
        if: steps.cache_nim_toolchain.outputs.cache-hit != 'true' && steps.setup_nim.outcome == 'failure'
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: 2.2.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add cached Nim to PATH
        if: steps.cache_nim_toolchain.outputs.cache-hit == 'true'
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.2

      # build_wasm.sh writes frameos.js, frameos.wasm, preview-worker.js and
      # a version.json stamp (interpreter version, release, commit) into the
      # output directory; the tarball holds those four files at its top
      # level. Named by the release version like the firmware images, so
      # the cloud can pin it from versions.json's `docker` entry.
      - name: Build the wasm runtime
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
          FRAMEOS_WASM_COMMIT: ${{ needs.update-versions.outputs.release_sha }}
        run: |
          set -euo pipefail
          out="$PWD/release-assets/frameos-$DOCKER_VERSION-wasm"
          mkdir -p "$out"
          (cd frameos && nimble install -d -y && ./tools/build_wasm.sh --out "$out")
          test -f "$out/version.json"
          tar -czf "release-assets/frameos-$DOCKER_VERSION-wasm.tar.gz" \
            -C "$out" frameos.js frameos.wasm preview-worker.js version.json
          rm -rf "$out"
          ls -lh release-assets/

      # Signed here, on the GitHub-hosted runner, the same way the ESP32
      # firmware is: the .minisig travels with the artifact so npm-publish.yml
      # can verify the bundle it downloads by run id (an arbitrary run id is
      # otherwise a way to publish any tarball to npm), and the github-release
      # job keeps a signature that already exists.
      - name: Sign wasm runtime
        env:
          FRAMEOS_FIRMWARE_SIGNING_KEY: ${{ secrets.FRAMEOS_FIRMWARE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FRAMEOS_FIRMWARE_SIGNING_KEY:-}" ]; then
            echo "::error::FRAMEOS_FIRMWARE_SIGNING_KEY secret is not set — refusing to publish an unsigned wasm runtime"
            exit 1
          fi
          python3 -m pip install --quiet --require-hashes --break-system-packages \
              -r tools/requirements-signing.txt \
            || python3 -m pip install --quiet --require-hashes -r tools/requirements-signing.txt
          keyfile=$(mktemp)
          printf '%s\n' "$FRAMEOS_FIRMWARE_SIGNING_KEY" > "$keyfile"
          status=0
          python3 tools/sign_firmware.py sign --secret "$keyfile" \
            release-assets/frameos-*-wasm.tar.gz || status=$?
          shred -u "$keyfile"
          [ "$status" -eq 0 ] || exit "$status"
          python3 tools/sign_firmware.py verify \
            --public release-assets/firmware-signing.pub release-assets/frameos-*-wasm.tar.gz

      - name: Upload wasm runtime
        uses: actions/upload-artifact@v4
        with:
          # frameos-<version>-* so the github-release job picks it up and
          # attaches it (with its signature) next to the other archives.
          name: frameos-${{ needs.update-versions.outputs.docker_version }}-wasm
          path: |
            release-assets/*-wasm.tar.gz
            release-assets/*-wasm.tar.gz.minisig
          if-no-files-found: error

  # Prebuilt thin-client firmware for Raspberry Pi Pico W / Pico 2 W (the
  # Pimoroni Inky Frame family). Generic on purpose: UF2s flash over BOOTSEL
  # drag-drop and provision over the USB serial console, the backend never
  # builds them per-frame.
  build-pico-firmware:
    name: Build Pico W / Pico 2 W firmware
    needs: [update-versions]
    # Pinned like every hosted job here (see the top of this file), and in
    # step with the pico-firmware job in pull-request-tests.yml.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - name: Install pico toolchain
        uses: ./.github/actions/pico-toolchain

      - name: Cache pico-sdk
        id: pico-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2.1.1

      - name: Fetch pico-sdk
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk
          git submodule update --init --depth 1 lib/cyw43-driver lib/lwip lib/mbedtls lib/tinyusb

      - name: Build firmware
        env:
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd embedded/pico
          for board in pico_w pico2_w; do
            cmake -B "build-$board" -DPICO_BOARD="$board" \
              -DPICO_SDK_PATH="$HOME/pico-sdk" \
              -DFRAMEOS_VERSION="$DOCKER_VERSION" -G Ninja
            cmake --build "build-$board"
          done
          cp build-pico_w/frameos_pico.uf2 \
            "../../release-assets/frameos-$DOCKER_VERSION-pico-w.uf2"
          cp build-pico2_w/frameos_pico.uf2 \
            "../../release-assets/frameos-$DOCKER_VERSION-pico-2w.uf2"
          ls -lh ../../release-assets/

      - name: Upload Pico firmware
        uses: actions/upload-artifact@v4
        with:
          # github-release downloads artifacts by the frameos-<version>-*
          # name pattern, so this name must keep that prefix.
          name: frameos-${{ needs.update-versions.outputs.docker_version }}-pico
          path: |
            release-assets/*-pico-w.uf2
            release-assets/*-pico-2w.uf2
          if-no-files-found: error

  # The runtime image, one native build per platform:
  # amd64 on an epyc-8 slot, arm64 on GitHub's free Ampere runners, where the
  # cross legs already build. Never under QEMU: the image compiles QuickJS,
  # Nim programs, the wasm bundle and the frontend per platform, and an
  # emulated build lost to four native cores the last time that was measured
  # (backend/app/utils/release_targets.py). Each leg pushes its image to
  # Docker Hub by digest only — no tag — with a per-platform layer cache on
  # GHCR, so a release rebuilds only what its commit changed; push-multiarch
  # then stitches the two digests into the tagged manifest list. The legs
  # need nothing but the release commit (the Dockerfile copies no release
  # asset), so they run beside the cross matrix instead of after it; the
  # rule that the tags appear only once the binaries exist is kept by
  # push-multiarch's needs.
  build-runtime-image:
    name: Build runtime image (${{ matrix.platform }})
    needs: [update-versions]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: epyc-8
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=frameos/frameos,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/frameos/frameos-build-cache:runtime-${{ matrix.arch }},mode=max

      # One empty file named by the digest; push-multiarch globs them.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the build: '$DIGEST'" >&2; exit 1 ;; esac
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-multiarch:
    needs: [update-versions, build-prebuilt-cross, build-buildroot-release-image, build-runtime-image]
    # Nothing is built here. The two platform images are already on Docker
    # Hub by digest; this job writes the tagged manifest list that points at
    # them, so a free GitHub-hosted runner is plenty.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read Docker version tags
        shell: bash
        run: |
          DOCKER_VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['docker'].split('+', 1)[0])")
          {
            echo "DOCKER_VERSION=$DOCKER_VERSION"
            echo "DOCKER_VERSION_MINOR=${DOCKER_VERSION%.*}"
            echo "DOCKER_VERSION_MAJOR=${DOCKER_VERSION%%.*}"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Push multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd /tmp/digests
          # Exactly the two platform legs, each a file named by its digest.
          sources=()
          for digest in *; do
            sources+=("frameos/frameos@sha256:${digest}")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "expected 2 image digests, found ${#sources[@]}: ${sources[*]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t frameos/frameos:latest \
            -t "frameos/frameos:${DOCKER_VERSION_MAJOR}" \
            -t "frameos/frameos:${DOCKER_VERSION_MINOR}" \
            -t "frameos/frameos:${DOCKER_VERSION}" \
            "${sources[@]}"
          docker buildx imagetools inspect "frameos/frameos:${DOCKER_VERSION}"

  update-addon-repo:
    name: Update Home Assistant Addon
    needs: [update-versions, push-multiarch, release-notes]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frameos
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}
          path: frameos

      - name: Checkout frameos-home-assistant-addon
        uses: actions/checkout@v4
        with:
          repository: frameos/frameos-home-assistant-addon
          token: ${{ secrets.ACTIONS_WRITE_TOKEN }}
          ref: main
          path: home-assistant-addon

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.update-versions.outputs.docker_version }}

      - name: Read Docker version
        shell: bash
        run: |
          DOCKER_VERSION=$(python3 -c "import json; print(json.load(open('frameos/versions.json'))['docker'].split('+', 1)[0])")
          echo "DOCKER_VERSION=$DOCKER_VERSION" >> "$GITHUB_ENV"

      - name: Update version in config.yaml
        run: |
          cd home-assistant-addon/frameos
          echo "Updating version in config.yaml to ${{ env.DOCKER_VERSION }}"
          sed -i "s/^version: .*/version: ${{ env.DOCKER_VERSION }}/" config.yaml

      - name: Prepend release notes to the addon changelog
        run: |
          python3 - <<'EOF'
          import datetime
          import os
          import re
          from pathlib import Path

          version = os.environ["DOCKER_VERSION"]
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")

          notes = Path("release-notes.md").read_text()
          # Keep version headers at the top level: demote "## New features" -> "###"
          notes = re.sub(r"^(##+)", r"#\1", notes, flags=re.M)
          # The "Docker images" block is appended later for the GitHub release only
          notes = re.sub(r"\n?### Docker images\n(?:.*\n?)*?(?=\n### |\Z)", "", notes).strip()
          section = f"## {version} ({date})\n\n{notes}\n"

          path = Path("home-assistant-addon/frameos/CHANGELOG.md")
          header = "# Changelog\n\n"
          changelog = path.read_text() if path.exists() else header
          if f"\n## {version} " in changelog:
              print(f"Changelog already contains {version}, skipping")
          else:
              first_entry = changelog.find("\n## ")
              if first_entry == -1:
                  changelog = changelog.rstrip() + "\n\n" + section
              else:
                  changelog = changelog[: first_entry + 1] + section + "\n" + changelog[first_entry + 1 :]
              path.write_text(changelog)
              print(f"Added changelog entry for {version}")
          EOF

      - name: Commit changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4 — SHA-pinned: a tag can be moved, and this job holds a write token
        with:
          message: 'Update FrameOS version to ${{ env.DOCKER_VERSION }}'
          add: '.'
          cwd: home-assistant-addon
          push: true
          author_name: FrameOS Bot
          author_email: git@frameos.net

  github-release:
    name: Create GitHub Release
    needs: [update-versions, push-multiarch, build-prebuilt-cross, build-buildroot-release-image, build-esp32-generic-firmware, build-esp32-layout-firmware, build-wasm-runtime, build-pico-firmware, update-addon-repo, release-notes]
    runs-on: ubuntu-24.04
    steps:
      # Shallow: this job only needs a working directory for `gh` and the
      # downloaded artifacts. Release notes come from an artifact and the tag
      # is created from RELEASE_SHA, so no history is read here.
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-versions.outputs.release_sha }}
          fetch-depth: 1

      - name: Download prebuilt cross artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frameos-${{ needs.update-versions.outputs.docker_version }}-*
          path: release-assets
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.update-versions.outputs.docker_version }}

      # Signed OTA, both halves, on a GitHub-hosted runner — the ONLY place
      # the firmware signing key is ever unsealed. A Pi verifies the release
      # archive against the key compiled into its binary before unpacking it
      # (frameos/src/frameos/upgrade.nim); an ESP32 verifies its image before
      # switching boot slots (fos_ota.c). The .tar.gz archives and the
      # ESP32 images built on self-hosted runners (which must never see the
      # key) are signed here; images a GitHub-hosted job already signed keep
      # their .minisig. An unsigned asset must fail the release, loudly.
      #
      # The buildroot .img.gz SD-card images are signed too: the backend's
      # SD-card builder and the cloud's browser flasher fetch and patch them
      # automatically (app/tasks/buildroot_image.py verifies the .minisig on
      # download and on every cache hit), so they are no longer "flashed by
      # hand from a machine that already trusts what it downloaded".
      - name: Sign release archives and firmware
        env:
          FRAMEOS_FIRMWARE_SIGNING_KEY: ${{ secrets.FRAMEOS_FIRMWARE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FRAMEOS_FIRMWARE_SIGNING_KEY:-}" ]; then
            echo "::error::FRAMEOS_FIRMWARE_SIGNING_KEY secret is not set — refusing to publish unsigned release archives"
            exit 1
          fi
          shopt -s nullglob
          archives=()
          for asset in release-assets/frameos-*.tar.gz release-assets/frameos-*.bin release-assets/frameos-*.img.gz release-assets/frameos-*.uf2; do
            [ -f "$asset.minisig" ] || archives+=("$asset")
          done
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::no release archives found to sign"
            exit 1
          fi
          # Same hash pin as "Sign ESP32 firmware", for the same reason.
          python3 -m pip install --quiet --require-hashes --break-system-packages \
              -r tools/requirements-signing.txt \
            || python3 -m pip install --quiet --require-hashes -r tools/requirements-signing.txt
          keyfile=$(mktemp)
          printf '%s\n' "$FRAMEOS_FIRMWARE_SIGNING_KEY" > "$keyfile"
          status=0
          python3 tools/sign_firmware.py sign --secret "$keyfile" "${archives[@]}" || status=$?
          shred -u "$keyfile"
          [ "$status" -eq 0 ] || exit "$status"
          # Same counterpart check the firmware job makes: a rotated-but-not-
          # committed secret would sign archives no frame accepts, and the
          # failure would only show up on devices.
          # Every signable asset must now carry a signature — the ones signed
          # here and the ones a GitHub-hosted firmware job signed before upload.
          # `verify` also checks what each asset was signed AS: the trusted
          # comment (covered by the global signature) must name the file
          # exactly as it is about to be published. Devices, the backend and
          # the cloud refuse an asset whose signature names another version
          # or target (docs/security-todo.md, closed 2026-09-19), so an asset
          # renamed after signing has to fail HERE, not on every frame.
          for asset in release-assets/frameos-*.tar.gz release-assets/frameos-*.bin release-assets/frameos-*.img.gz release-assets/frameos-*.uf2; do
            [ -f "$asset.minisig" ] || { echo "::error::$asset is unsigned"; exit 1; }
            python3 tools/sign_firmware.py verify \
              --public release-assets/firmware-signing.pub "$asset"
          done
          ls -lh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
          RELEASE_TAG: ${{ needs.update-versions.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.update-versions.outputs.release_sha }}
        run: |
          ls -lh release-assets

          cat >> release-notes.md <<EOF

          ## Docker images
          - [frameos/frameos:latest](https://hub.docker.com/r/frameos/frameos/tags?name=latest)
          - [frameos/frameos:${DOCKER_VERSION}](https://hub.docker.com/r/frameos/frameos/tags?name=${DOCKER_VERSION})
          - [frameos/frameos:${DOCKER_VERSION%.*}](https://hub.docker.com/r/frameos/frameos/tags?name=${DOCKER_VERSION%.*})
          - [frameos/frameos:${DOCKER_VERSION%%.*}](https://hub.docker.com/r/frameos/frameos/tags?name=${DOCKER_VERSION%%.*})
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "FrameOS ${DOCKER_VERSION}" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "FrameOS ${DOCKER_VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Dispatch Discord notification
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_VERSION: ${{ needs.update-versions.outputs.docker_version }}
          RELEASE_TAG: ${{ needs.update-versions.outputs.release_tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.update-versions.outputs.release_tag }}
        run: |
          gh workflow run discord-release.yml \
            --ref main \
            -f release_name="FrameOS ${DOCKER_VERSION}" \
            -f release_tag="$RELEASE_TAG" \
            -f release_url="$RELEASE_URL"
