# The Xcode project, generated: `xcodegen` here (or ios/bin/open) writes
# FrameOS.xcodeproj, which is not committed. The app target is only the
# entry point and its assets; the code is the two local packages.
name: FrameOS
options:
  bundleIdPrefix: net.frameos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The FrameOS release this app was built next to (versions.json "frameos").
    MARKETING_VERSION: "2026.11.6"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FrameOSKit:
    path: FrameOSKit
  FrameOSUI:
    path: FrameOSUI
targets:
  FrameOS:
    type: application
    platform: iOS
    sources:
      - path: FrameOS
    dependencies:
      - package: FrameOSUI
      - package: FrameOSKit
    info:
      path: FrameOS/Info.plist
      properties:
        CFBundleDisplayName: FrameOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: FrameOS uploads the photos you pick to your photo albums and to your frames.
        NSLocalNetworkUsageDescription: FrameOS talks to the self-hosted FrameOS backend you sign in to on your network.
        # A self-hosted backend is often plain http, on a bare IP, a .local
        # name or an ordinary hostname; the cloud is https. Arbitrary loads
        # alone: with NSAllowsLocalNetworking beside it iOS ignores
        # NSAllowsArbitraryLoads, and http to a hostname that is not "local"
        # (frames.example.com, frameos.home.arpa) was refused.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    # Sign in with Apple (cloud/docs/auth.md): the App ID net.frameos.app has
    # the capability ticked, so the App Store profile carries it.
    entitlements:
      path: FrameOS/FrameOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.frameos.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # The UI tests (ios/bin/ui-test): the sign-in screen on every build, and
  # a tour of the whole app when a backend is named.
  FrameOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FrameOSUITests
    dependencies:
      - target: FrameOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.frameos.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  FrameOS:
    build:
      targets:
        FrameOS: all
    test:
      targets:
        - package: FrameOSKit/FrameOSKitTests
        - FrameOSUITests
