# /etc/systemd/zram-generator.conf on the runner host (package
# systemd-zram-generator). Compressed swap in RAM as the shock absorber for
# the runner pool: VM memory is shared memfd, which the kernel can only
# reclaim by swapping it out, and the box had 4 G of disk swap (full) in
# front of the OOM killer — 29 qemu processes were killed in the six days
# after the pool doubled, each one a job that "lost communication with the
# server". 64 G of lz4 zram turns that cliff into a slowdown. Priority above
# the md0 disk swap so it is used first.
[zram0]
zram-size = 65536
compression-algorithm = lz4
swap-priority = 100
