repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-yaml
    - id: trailing-whitespace
      files: ^(backend/|frameos/vendor/).*$

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Same ruff as backend/requirements.txt; the rule set is backend/ruff.toml
  # (the CI gate "Backend lint and types" runs the same check).
  rev: v0.16.1
  hooks:
    - id: ruff
      files: ^backend/.*$
