packages:
  - frontend
  - frameos/frontend
  - cloud-frontend
  - frameos/wasm
  - frameos/editor
  - cloud
  - cloud/apps/*
  - cloud/packages/*

overrides:
  csstype: 3.2.3
  sharp: '>=0.35.0'
  # Security floors for transitive deps flagged by Dependabot
  shell-quote: '>=1.9.0'
  body-parser@1: '>=1.20.6 <2'
  brace-expansion@2: '>=2.1.4 <3'
  immutable@5: '>=5.1.8'
  lodash: '>=4.18.0'
  lodash-es: '>=4.18.0'
  path-to-regexp@0.1: '>=0.1.13 <0.2'
  picomatch@2: '>=2.3.2 <3'
  picomatch@4: '>=4.0.4'
  postcss@8: '>=8.5.23'
  qs@6: '>=6.15.2'
  svgo@4: '>=4.0.2'
  nanoid@3: '>=3.3.18 <4'
  dompurify@3: '>=3.4.13'
  '@babel/core@7': '>=7.29.6 <8'
  '@babel/plugin-transform-modules-systemjs@7': '>=7.29.4 <8'

packageExtensions:
  kea-forms@*:
    peerDependencies:
      typescript: ">=5.0.0"
