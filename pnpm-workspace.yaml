packages:
  - frontend
  - frameos/frontend
  - cloud-frontend
  - frameos/wasm
  - frameos/editor
  - cloud
  - cloud/apps/*
  - cloud/packages/*

overrides:
  csstype: 3.2.3
  sharp: '^0.35.5'
  # Security floors for transitive deps flagged by Dependabot
  shell-quote: '^1.11.0'
  body-parser@1: '>=1.20.9 <2'
  body-parser@2: '^2.4.0'
  brace-expansion@1: '>=1.1.22 <2'
  brace-expansion@2: '>=2.1.8 <3'
  brace-expansion@5: '>=5.0.13 <6'
  immutable@5: '>=5.1.8'
  lodash: '>=4.18.0'
  lodash-es: '>=4.18.0'
  path-to-regexp@0.1: '>=0.1.13 <0.2'
  picomatch@2: '>=2.3.2 <3'
  picomatch@4: '>=4.0.4'
  postcss@8: '>=8.5.23'
  qs@6: '^6.16.1'
  svgo@4: '^4.1.0'
  nanoid@3: '>=3.3.18 <4'
  dompurify@3: '^3.4.17'
  '@babel/core@7': '>=7.29.6 <8'
  '@babel/plugin-transform-modules-systemjs@7': '>=7.29.4 <8'
  browserslist@4: '^4.28.7'
  baseline-browser-mapping@2: '^2.11.0'
  postcss-selector-parser@6: '>=6.1.6 <7'
  postcss-selector-parser@7: '^7.1.6'
  colord@2: '^2.9.4'
  js-yaml@4: '^4.3.2'
  minimatch@10: '^11.0.1'
  fast-uri@3: '^3.1.9'
  ip-address@10: '^10.7.4'
  proxy-addr@2: '^2.0.8'
  source-map-js@1: '^1.2.2'
  probe-image-size@7: '^7.4.0'
  hono@4: '^4.13.16'
  '@hono/node-server@2': '^2.1.6'

packageExtensions:
  kea-forms@*:
    peerDependencies:
      typescript: ">=5.0.0"
