schema-version = "1.10.0"

[install]
cacert.pkg-path = "cacert"
cacert.outputs = "all"
coreutils.pkg-path = "coreutils"
coreutils.outputs = "all"
git.pkg-path = "git"
git.outputs = "all"
nodejs.pkg-path = "nodejs_22"
openssl.pkg-path = "openssl"
openssl.outputs = "all"
pnpm.pkg-path = "pnpm"
postgresql.pkg-path = "postgresql"

[vars]
NEXT_TELEMETRY_DISABLED = "1"

[hook]
on-activate = '''
  set -euo pipefail

  cd "$FLOX_ENV_PROJECT"

  export FRAMEOS_CLOUD_FLOX_CACHE_DIR="$FLOX_ENV_PROJECT/.flox/cache"
  mkdir -p "$FRAMEOS_CLOUD_FLOX_CACHE_DIR"

  nvm_dir="${NVM_DIR:-$HOME/.nvm}"
  cleaned_path=""
  old_ifs=$IFS
  IFS=:
  for path_entry in $PATH; do
    case "$path_entry" in
      "$FLOX_ENV/bin"|"$FLOX_ENV/sbin"|"$nvm_dir"/*/bin|"${NVM_BIN:-__frameos_cloud_no_nvm_bin__}")
        continue
        ;;
      *)
        cleaned_path="${cleaned_path:+$cleaned_path:}$path_entry"
        ;;
    esac
  done
  IFS="$old_ifs"

  unset NVM_BIN NVM_INC
  export PATH="$FLOX_ENV/bin:$FLOX_ENV/sbin${cleaned_path:+:$cleaned_path}"

  workspace_files="package.json pnpm-workspace.yaml"
  for manifest in apps/*/package.json packages/*/package.json services/*/package.json; do
    if [ -f "$manifest" ]; then
      workspace_files="$workspace_files $manifest"
    fi
  done

  if [ -f pnpm-lock.yaml ]; then
    workspace_files="$workspace_files pnpm-lock.yaml"
  fi

  js_workspace_hash="$(sha256sum $workspace_files | sha256sum | awk '{print $1}')"
  js_stamp="$FRAMEOS_CLOUD_FLOX_CACHE_DIR/pnpm-workspace.sha256"
  if [ ! -f node_modules/.modules.yaml ] || [ ! -f "$js_stamp" ] || [ "$(cat "$js_stamp")" != "$js_workspace_hash" ]; then
    echo "Syncing frameos-cloud pnpm workspace dependencies..."
    if [ -f pnpm-lock.yaml ] && [ "${CI:-}" = "1" ]; then
      pnpm install --frozen-lockfile
    else
      pnpm install
    fi
    printf '%s' "$js_workspace_hash" > "$js_stamp"
  fi
'''

[profile]
bash = '''
  nvm_dir="${NVM_DIR:-$HOME/.nvm}"
  cleaned_path=""
  old_ifs=$IFS
  IFS=:
  for path_entry in $PATH; do
    case "$path_entry" in
      "$FLOX_ENV/bin"|"$FLOX_ENV/sbin"|"$nvm_dir"/*/bin|"${NVM_BIN:-__frameos_cloud_no_nvm_bin__}")
        continue
        ;;
      *)
        cleaned_path="${cleaned_path:+$cleaned_path:}$path_entry"
        ;;
    esac
  done
  IFS="$old_ifs"

  unset NVM_BIN NVM_INC
  export PATH="$FLOX_ENV/bin:$FLOX_ENV/sbin${cleaned_path:+:$cleaned_path}"
  hash -r 2>/dev/null || true
'''

zsh = '''
  nvm_dir="${NVM_DIR:-$HOME/.nvm}"
  cleaned_path=""
  old_ifs=$IFS
  IFS=:
  for path_entry in $PATH; do
    case "$path_entry" in
      "$FLOX_ENV/bin"|"$FLOX_ENV/sbin"|"$nvm_dir"/*/bin|"${NVM_BIN:-__frameos_cloud_no_nvm_bin__}")
        continue
        ;;
      *)
        cleaned_path="${cleaned_path:+$cleaned_path:}$path_entry"
        ;;
    esac
  done
  IFS="$old_ifs"

  unset NVM_BIN NVM_INC
  export PATH="$FLOX_ENV/bin:$FLOX_ENV/sbin${cleaned_path:+:$cleaned_path}"
  hash -r 2>/dev/null || true
'''

fish = '''
  set -e NVM_BIN NVM_INC NVM_HAS_RUN

  for fn in node npm npx yarn
    if functions -q $fn
      functions -e $fn
    end
  end

  set -l cleaned_path
  for path_entry in $PATH
    if test "$path_entry" = "$FLOX_ENV/bin"
      continue
    end

    if test "$path_entry" = "$FLOX_ENV/sbin"
      continue
    end

    if string match -q "$HOME/.nvm/*/bin" -- $path_entry
      continue
    end

    set cleaned_path $cleaned_path $path_entry
  end

  set -gx PATH "$FLOX_ENV/bin" "$FLOX_ENV/sbin" $cleaned_path
'''
