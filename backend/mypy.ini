# Backend type-check settings. CI runs `python tools/mypy_gate.py` (the
# "Backend lint and types" job): mypy against these settings, then every
# error is compared with mypy-baseline.txt — the debt the code carried when
# the gate was added. New errors fail the job; fixed ones are removed from
# the baseline with `python tools/mypy_gate.py --update`.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
pretty = False
warn_unused_ignores = False
no_error_summary = False
exclude = (?x)(
    ^migrations/
  )
