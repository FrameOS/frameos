<!DOCTYPE html>
<html lang="en" class="bg-gray-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-2/logo.svg" data-frameos-favicon />
    <script>
      try {
        const storedTheme = window.localStorage.getItem('frameos.workspaceTheme')
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : window.matchMedia?.('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.dataset.frameosTheme = theme
        document.documentElement.style.colorScheme = theme

        // Mirrors utils/frameosTheme.ts, which takes over once the bundle
        // loads. Note it keys off prefers-color-scheme, NOT the `theme`
        // resolved above: the icon is painted into the tab strip, so it has
        // to contrast with the browser's colours, not the workspace's. A
        // dark Chrome showing a light-themed workspace was drawing the black
        // glyph onto a dark tab strip.
        const favicon = document.querySelector('link[data-frameos-favicon]')
        if (favicon) {
          const basePath = ((window.FRAMEOS_APP_CONFIG && window.FRAMEOS_APP_CONFIG.ingress_path) || '').replace(
            /\/$/,
            ''
          )
          const host = window.location.hostname.toLowerCase()
          const isLocal =
            host === 'localhost' ||
            host.endsWith('.localhost') ||
            host === '127.0.0.1' ||
            host === '0.0.0.0' ||
            host === '::1' ||
            host === '[::1]'
          const darkChrome = window.matchMedia?.('(prefers-color-scheme: dark)').matches
          const icon = isLocal
            ? darkChrome
              ? '/img/logo-2/logo-white.svg'
              : '/img/logo-2/logo-black.svg'
            : darkChrome
            ? '/img/logo-2/logo-white-colors.svg'
            : '/img/logo-2/logo.svg'
          favicon.href = basePath + icon
        }
      } catch (error) {}
    </script>
    <title>FrameOS Backend</title>
  </head>
  <body class="text-white">
    <div id="root"></div>
    <div id="modal" style="position: absolute; z-index: 10"></div>
    <div id="popper" style="position: absolute; z-index: 80"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
