procs:
  backend:
    shell: pnpm run dev:backend
  worker:
    shell: pnpm run dev:worker
  vite:
    shell: pnpm --dir frontend run dev:vite
  kea:
    shell: pnpm --dir frontend run dev:kea
  redis:
    shell: pnpm run dev:redis
  wasm:
    shell: bash frameos/tools/build_wasm.sh
    autostart: true
  frameos:
    shell: cd frameos && make
    autostart: false
  cloud:
    shell: sh -c 'cd cloud && scripts/db-setup.sh && exec pnpm run dev'
    autostart: false
  cloud-hub:
    shell: sh -c 'cd cloud && scripts/db-setup.sh && exec pnpm run dev:hub'
    autostart: false
  backend-docker:
    shell: bash scripts/backend-docker.sh
    autostart: false
  migrate:
    shell: pnpm run dev:migrate
    autostart: false
